<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雷駿先輩</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes flashRed {
      0%, 100% { opacity: 0; }
      50%       { opacity: 1; }
    }

    @keyframes flashTap {
      0%   { opacity: 0.6; }
      100% { opacity: 0; }
    }

    @keyframes scorePop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      touch-action: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ===== スタート画面 ===== */
    #screen-start {
      background: #000;
      color: #fff;
      gap: 24px;
    }

    #screen-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("kireishun.JPG");
      background-size: cover;
      background-position: center;
      opacity: 0.4;
      z-index: 0;
    }

    #screen-start > * {
      position: relative;
      z-index: 1;
    }

    #screen-start h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #mode-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      max-width: 360px;
    }

    .btn-mode {
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }

    .btn-mode:hover, .btn-mode.active {
      background: #fff;
      color: #111;
    }

    /* ===== アップデート情報 ===== */
    #update-info {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 14px 20px;
      width: 320px;
      text-align: left;
    }

    #update-info-title {
      font-size: 12px;
      font-weight: 700;
      color: #ff69b4;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    #update-info ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #update-info ul li {
      font-size: 13px;
      color: #ddd;
      padding-left: 14px;
      position: relative;
      line-height: 1.4;
    }

    #update-info ul li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #ff69b4;
    }

    /* ===== ゲーム画面 ===== */
    #screen-game {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      z-index: 10;
      pointer-events: none;
    }

    #hud-score {
      font-size: 120px;
      font-weight: 700;
      color: #ff69b4;
      line-height: 1;
    }

    #hud-score.music-score {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 30px;
      text-align: left;
      transform-origin: left center;
    }

    #hud-score.pop {
      animation: scorePop 0.18s ease-out;
    }

    #hud-combo {
      font-size: 120px;
      font-weight: 700;
      color: #ff69b4;
      line-height: 1;
      display: none;
    }

    #hud-timer {
      font-size: 60px;
      font-weight: 700;
      color: orange;
      line-height: 1;
    }

    #hud-timer.warning { color: #f44; }

    #hud-mode {
      font-size: 24px;
      font-weight: 700;
      color: #aaf;
      letter-spacing: 2px;
    }

    #hit-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: rgba(255, 105, 180, 0.08);
      z-index: 5;
      pointer-events: none;
      display: none;
    }


    #lane-container {
      position: absolute;
      inset: 0;
      display: flex;
      background: #fff;
      overflow: hidden;
    }

    .lane {
      flex: 1;
      position: relative;
      border-right: 2px solid #ccc;
    }

    .lane:last-child { border-right: none; }

    .note {
      position: absolute;
      left: 4px;
      right: 4px;
      border-radius: 6px;
      background-image: url("IMG_E2720[1].JPG");
      background-size: cover;
      background-position: center;
      will-change: transform;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .note-heal {
      background-image: url("kireishun.JPG");
      outline: 3px solid #00ff88;
      box-shadow: 0 0 12px #00ff88;
    }

    .note-trap {
      background-image: url("0afd0369.jpg");
      outline: 3px solid #ff4400;
      box-shadow: 0 0 12px #ff4400;
    }

    .note-long {
      background-image: url("IMG_E2720[1].JPG");
      background-size: 100% 100%;
      outline: 3px solid #aabbff;
      box-shadow: 0 0 14px #4466ff;
    }

    .note-long.held {
      outline: 3px solid #ccddff;
      box-shadow: 0 0 24px #aabbff, 0 0 48px rgba(180,210,255,0.7);
      filter: brightness(1.4);
    }

    /* ===== ゲームオーバー画面 ===== */
    #screen-gameover {
      background-color: #111;
      color: #fff;
      gap: 20px;
    }

    #screen-gameover h2 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f44;
    }

    #final-score {
      font-size: 32px;
      font-weight: 700;
    }

    #final-score span {
      font-size: 48px;
      color: #ff0;
    }

    #final-rank {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    #final-rank span {
      font-size: 40px;
      color: #ff69b4;
    }

    #nickname-input {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      text-align: center;
      width: 240px;
      outline: none;
    }

    #nickname-input::placeholder { color: #aaa; }

    #ranking-wrap {
      width: 280px;
      max-height: 180px;
      overflow-y: auto;
    }

    #ranking-title {
      font-size: 18px;
      font-weight: 700;
      color: #aaa;
      margin-bottom: 6px;
      text-align: center;
    }

    #ranking-list {
      list-style: none;
      width: 100%;
    }

    #ranking-list li {
      font-size: 15px;
      padding: 4px 0;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }

    #ranking-list li.me { color: #ff69b4; }

    #btn-retry {
      margin-top: 8px;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
    }

    #btn-home {
      padding: 10px 28px;
      font-size: 15px;
      font-weight: 700;
      background: transparent;
      color: #aaa;
      border: 2px solid #aaa;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    /* ===== 譜面メーカー（エディタ） ===== */
    #screen-editor {
      background: #111;
      color: #fff;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 6px;
      gap: 6px;
    }
    #editor-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    #editor-top label { display: flex; align-items: center; gap: 3px; }
    #editor-top select, #editor-top input {
      font-size: 12px; padding: 4px 6px; border-radius: 6px;
      border: 1px solid #555; background: #222; color: #fff;
    }
    #editor-top input { width: 60px; }
    #editor-top button {
      font-size: 12px; padding: 4px 8px; border-radius: 6px;
      border: 1px solid #888; background: #333; color: #fff; cursor: pointer;
    }
    .ed-subdiv.active { background: #fff; color: #111; }
    .ed-width.active  { background: #ff69b4; color: #111; }
    #lane-container.lc8 .lane { border-right: none; }

    #editor-main { flex: 1; display: flex; gap: 6px; min-height: 0; }

    #editor-palette {
      width: 72px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
    }
    .ed-pal {
      padding: 10px 4px; border-radius: 8px; border: 2px solid #555;
      background: #222; color: #fff; font-size: 12px; cursor: pointer; text-align: center;
    }
    .ed-pal.active { border-color: #ff69b4; background: #3a2030; }
    .ed-pal-clear { border-color: #ee4433; color: #ff8877; }

    #editor-scroll {
      flex: 1; overflow-y: auto; background: #1a1a1a;
      border: 1px solid #444; position: relative; min-width: 0;
    }
    #editor-scroll.ed-noscroll { touch-action: none; }
    #editor-grid { position: relative; display: flex; width: 100%; }
    .ed-lane { flex: 1; position: relative; }
    .ed-bd-dark  { border-right: 1px solid #888; }    /* 元の4レーン境界(濃い) */
    .ed-bd-light { border-right: 1px solid #2f2f2f; }  /* 追加した境界(薄い) */
    #editor-notes { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    #editor-lines { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .ed-beatline { position: absolute; left: 0; right: 0; height: 1px; background: #2c2c2c; }
    .ed-beatline.beat    { background: #4a4a4a; }
    .ed-beatline.measure { background: #7a7a7a; }
    #editor-nowline {
      position: absolute; left: 0; right: 0; height: 2px; background: #ff69b4;
      z-index: 5; pointer-events: none; top: 0;
    }
    #editor-startline {
      position: absolute; left: 0; right: 0; height: 0;
      border-top: 4px solid #ffeb3b; z-index: 4; pointer-events: none; top: 0;
    }
    #editor-startline::after {
      content: 'スタート ▼';
      position: absolute; right: 4px; top: -17px;
      font-size: 11px; font-weight: 700; color: #111;
      background: #ffeb3b; padding: 1px 6px; border-radius: 4px;
    }
    .ed-note {
      position: absolute; z-index: 3;
      border-radius: 4px; background: #4aa3ff; border: 1px solid #cfe6ff; box-sizing: border-box;
    }
    .ed-note-long   { background: linear-gradient(to bottom, #88aaff, #2244cc); }
    .ed-note-heal   { background: #22cc77; }
    .ed-note-damage { background: #ee4433; }
    .ed-pending { outline: 2px dashed #ffeb3b; opacity: 0.7; }
    .ed-grabbed { outline: 3px solid #ffeb3b; box-shadow: 0 0 12px #ffeb3b; z-index: 6; }

    #editor-side { width: 72px; display: flex; flex-direction: column; gap: 6px; }
    #editor-side button {
      padding: 10px 4px; border-radius: 8px; border: 1px solid #888;
      background: #333; color: #fff; font-size: 12px; cursor: pointer;
    }
    #ed-play.playing { background: #ff69b4; color: #111; }
    #editor-side button:disabled { opacity: 0.35; }

    /* ===== みんなの譜面 / 作りかけ（一覧） ===== */
    #screen-browse, #screen-drafts {
      background: #111; color: #fff;
      flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 20px 12px; gap: 14px;
    }
    #browse-title, #drafts-title { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #ff69b4; }
    #browse-list, #drafts-list {
      width: 100%; max-width: 360px; flex: 1;
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .browse-item {
      display: flex; align-items: stretch; gap: 6px; width: 100%;
    }
    .bi-play {
      flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      text-align: left; padding: 12px 14px; border-radius: 10px;
      border: 1px solid #555; background: #1e1e1e; color: #fff; cursor: pointer;
    }
    .bi-play:hover { background: #2a2a2a; }
    .bi-title { font-size: 16px; font-weight: 700; }
    .bi-sub   { font-size: 12px; color: #aaa; }
    .bi-stat  { font-size: 12px; color: #7fd0ff; }
    .bi-del {
      width: 48px; flex: none; border-radius: 10px;
      border: 1px solid #a44; background: #2a1414; color: #ff8877;
      font-size: 18px; cursor: pointer;
    }
    .bi-del:disabled { opacity: 0.4; }
    .browse-empty { color: #aaa; text-align: center; padding: 20px; }
    #browse-buttons, #drafts-buttons { display: flex; gap: 10px; }
    #browse-buttons button, #drafts-buttons button {
      padding: 12px 24px; font-size: 15px; font-weight: 700;
      border-radius: 8px; border: 2px solid #aaa; background: transparent; color: #ddd; cursor: pointer;
    }
    #drafts-new { border-color: #ff69b4 !important; color: #ff69b4 !important; }
  </style>
</head>
<body>

  <div id="screen-start" class="screen">
    <h1>雷駿先輩</h1>
    <input id="nickname-input" type="text" placeholder="ニックネームを入力" maxlength="12">
    <div id="mode-buttons">
      <button class="btn-mode active" id="btn-mode-score">スコアアタック</button>
      <button class="btn-mode" id="btn-mode-endless">エンドレシュン</button>
      <button class="btn-mode" id="btn-mode-music">ミュージック</button>
      <button class="btn-mode" id="btn-mode-piano">ピアノタイル</button>
      <button class="btn-mode" id="btn-mode-maker">譜面メーカー</button>
      <button class="btn-mode" id="btn-mode-community">みんなの譜面</button>
    </div>
    <div id="update-info">
      <div id="update-info-title">アップデート情報</div>
      <ul>
        <li>ロングノーツを押している間は光るようにしました</li>
        <li>ロングノーツを追加しました</li>
        <li>ピアノタイルで一番下を押さないとミスにするようにしました</li>
        <li>ピアノタイルを追加しました</li>
        <li>エンドレシュンを追加しました</li>
        <li>ミュージックを簡単にしました</li>
      </ul>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div id="hud">
      <div id="hud-combo"></div>
      <div id="hud-score">0</div>
      <div id="hud-timer">60</div>
      <div id="hud-mode"></div>
    </div>
    <div id="lane-container">
      <div class="lane" id="lane-0"></div>
      <div class="lane" id="lane-1"></div>
      <div class="lane" id="lane-2"></div>
      <div class="lane" id="lane-3"></div>
      <div id="hit-zone"></div>
    </div>
  </div>

  <div id="screen-gameover" class="screen">
    <h2 id="gameover-title">GAME OVER</h2>
    <div id="final-score">SCORE: <span id="final-score-value">0</span></div>
    <div id="final-rank">あなたは<span id="final-rank-value"></span>です</div>
    <div id="ranking-wrap">
      <div id="ranking-title">ランキング</div>
      <ol id="ranking-list"></ol>
    </div>
    <button id="btn-retry">RETRY</button>
    <button id="btn-home">スタート画面へ</button>
  </div>

  <div id="screen-editor" class="screen">
    <div id="editor-top">
      <label>曲<select id="ed-song"></select></label>
      <label>型
        <select id="ed-type">
          <option value="piano">ピアノ</option>
          <option value="music">ミュージック</option>
        </select>
      </label>
      <label>BPM<input id="ed-bpm" type="number" min="30" max="400" value="120"></label>
      <button id="ed-tap">タップ計測</button>
      <label>ｵﾌｾｯﾄ<input id="ed-offset" type="number" step="0.05" value="0"></label>
      <span>音符</span>
      <button class="ed-subdiv active" data-subdiv="4">4分</button>
      <button class="ed-subdiv" data-subdiv="8">8分</button>
      <button class="ed-subdiv" data-subdiv="16">16分</button>
      <span>幅</span>
      <button class="ed-width active" data-width="1">1</button>
      <button class="ed-width" data-width="2">2</button>
      <button class="ed-width" data-width="3">3</button>
      <button class="ed-width" data-width="4">4</button>
    </div>
    <div id="editor-main">
      <div id="editor-palette"></div>
      <div id="editor-scroll">
        <div id="editor-grid">
          <div id="editor-lines"></div>
          <div class="ed-lane ed-bd-light"></div>
          <div class="ed-lane ed-bd-dark"></div>
          <div class="ed-lane ed-bd-light"></div>
          <div class="ed-lane ed-bd-dark"></div>
          <div class="ed-lane ed-bd-light"></div>
          <div class="ed-lane ed-bd-dark"></div>
          <div class="ed-lane ed-bd-light"></div>
          <div class="ed-lane"></div>
          <div id="editor-notes"></div>
          <div id="editor-nowline"></div>
          <div id="editor-startline"></div>
        </div>
      </div>
      <div id="editor-side">
        <button id="ed-undo">↶戻す</button>
        <button id="ed-redo">↷進む</button>
        <button id="ed-play">▶</button>
        <button id="ed-test">最初から</button>
        <button id="ed-test-here">ここから</button>
        <button id="ed-save">保存</button>
        <button id="ed-new">新規</button>
        <button id="ed-back">戻る</button>
      </div>
    </div>
  </div>

  <div id="screen-browse" class="screen">
    <h2 id="browse-title">みんなの譜面</h2>
    <div id="browse-list"></div>
    <div id="browse-buttons">
      <button id="browse-reload">更新</button>
      <button id="browse-back">スタート画面へ</button>
    </div>
  </div>

  <div id="screen-drafts" class="screen">
    <h2 id="drafts-title">作りかけの譜面</h2>
    <div id="drafts-list"></div>
    <div id="drafts-buttons">
      <button id="drafts-new">＋ 新規作成</button>
      <button id="drafts-back">スタート画面へ</button>
    </div>
  </div>

  <script type="module">
    // ===== Firebase =====
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, updateDoc, increment, collection, getDocs, orderBy, query, limit, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBYH3HbOtNWO9luF68n6jLou9SZwwlBQCE",
      authDomain: "raishn-c40e8.firebaseapp.com",
      projectId: "raishn-c40e8",
      storageBucket: "raishn-c40e8.firebasestorage.app",
      messagingSenderId: "575446359290",
      appId: "1:575446359290:web:e3cde3f05cbe5d5854fd43"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    async function saveScore(nickname, score, mode) {
      const collName = mode === 'music' ? 'scores_music' : mode === 'endless' ? 'scores_endless' : mode === 'piano' ? 'scores_piano' : 'scores';
      const ref = doc(db, collName, nickname);
      const existing = await getDoc(ref);
      if (!existing.exists() || existing.data().score < score) {
        await setDoc(ref, { nickname, score, timestamp: serverTimestamp() });
      }
    }

    async function loadRanking(mode) {
      const collName = mode === 'music' ? 'scores_music' : mode === 'endless' ? 'scores_endless' : mode === 'piano' ? 'scores_piano' : 'scores';
      const q = query(collection(db, collName), orderBy('score', 'desc'), limit(10));
      const snap = await getDocs(q);
      return snap.docs.map(d => d.data());
    }

    // ===== 譜面メーカー: 譜面の保存・一覧取得 =====
    async function saveChart(chart) {
      await addDoc(collection(db, 'charts'), {
        title:     chart.title,
        author:    chart.author,
        songId:    chart.songId,
        chartType: chart.chartType,
        bpm:       chart.bpm,
        offset:    chart.offset,
        noteSpeed: chart.noteSpeed,
        notes:     chart.notes,
        createdAt: serverTimestamp(),
      });
    }
    async function loadCharts() {
      const q = query(collection(db, 'charts'), orderBy('createdAt', 'desc'), limit(50));
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    async function deleteChart(id) {
      await deleteDoc(doc(db, 'charts', id));
    }
    function bumpChartStat(id, field) {   // プレイ数/クリア数を加算（失敗は無視）
      if (!id) return;
      updateDoc(doc(db, 'charts', id), { [field]: increment(1) }).catch(e => console.error('stat error:', e));
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    let nickname = '';

    // ===== 音声 (Web Audio API でラグゼロ) =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let tapBuffer = null;

    fetch('Voishun.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .then(decoded => { tapBuffer = decoded; });

    let gahoBuffer = null;
    fetch('gaho2.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .then(decoded => { gahoBuffer = decoded; });

    const bgmAudio = new Audio('Kurenaishin.mp3');
    bgmAudio.loop = true;

    function playGaho() {
      if (!gahoBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = gahoBuffer;
      src.connect(audioCtx.destination);
      src.start(0);
    }

    function playTapSound() {
      if (!tapBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = tapBuffer;
      src.connect(audioCtx.destination);
      src.start(0);
    }

    // ===== 定数 =====
    const TIME_LIMIT = 20;
    const ROWS = 3;


    // ===== DOM =====
    const screens = {
      start:    document.getElementById('screen-start'),
      game:     document.getElementById('screen-game'),
      gameover: document.getElementById('screen-gameover'),
      editor:   document.getElementById('screen-editor'),
      browse:   document.getElementById('screen-browse'),
      drafts:   document.getElementById('screen-drafts'),
    };
    const hudScore      = document.getElementById('hud-score');
    const hudTimer      = document.getElementById('hud-timer');
    const hudCombo      = document.getElementById('hud-combo');
    let combo = 0;

    // スコア加算時に数字を一瞬拡大させるポップ演出
    function popScore() {
      hudScore.classList.remove('pop');
      void hudScore.offsetWidth;   // アニメーションを毎回再発火させるためリフロー強制
      hudScore.classList.add('pop');
    }
    const finalScoreVal = document.getElementById('final-score-value');
    const laneContainer = document.getElementById('lane-container');
    const laneEls       = [0, 1, 2, 3].map(i => document.getElementById('lane-' + i));

    // ===== ゲーム状態 =====
    let STATE         = 'start';
    let gameMode      = 'score'; // 'score' | 'music'
    let score         = 0;
    let timeLeft      = TIME_LIMIT;
    let elapsedTotal  = 0;
    let lastTimestamp = null;
    let animFrameId   = null;
    let timerStarted  = false;
    // grid[0]=一番上の行, grid[3]=一番下の行, 各要素 {lane, el}
    let grid = [];

    // ===== ミュージックモード状態 =====
    const INITIAL_FALL_DURATION = 0.5;    // 開始時のnote落下秒数
    const SPEED_DOUBLE_SECS     = 180;    // 3分で2倍になる
    // BPM155: 2分・4分・8分・12分・16分音符 (ms)
    const SPAWN_INTERVALS = [774, 387, 194, 129, 97];

    function getSpawnInterval() {
      const elapsed   = nowSec() - musicStartTime;
      const progress  = Math.min(elapsed, 120) / 120;
      const speedMult = 1 + elapsed / SPEED_DOUBLE_SECS;
      const weights = [
        0.25,
        0.25 * (1 - progress),
        0.25,
        0.25,
        0.25 * progress,
      ];
      let rand = Math.random();
      for (let i = 0; i < SPAWN_INTERVALS.length; i++) {
        rand -= weights[i];
        if (rand <= 0) return SPAWN_INTERVALS[i] / speedMult;
      }
      return SPAWN_INTERVALS[SPAWN_INTERVALS.length - 1] / speedMult;
    }
    const HIT_ZONE_RATIO = 1.0;
    const NOTE_H_RATIO   = 0.325;
    let fallingNotes   = [];
    let spawnTimerId   = null;
    let lastSpawnLane  = -1;
    let heldLongNote   = null;
    let pianoPrevTime  = 0;
    let hp             = 1000;
    let musicStartTime = 0;        // nowSec() at game start

    // ===== 譜面メーカー: 同梱曲テーブル（songIdで参照。mp3を増やすにはここに1行追加）=====
    const SONGS = {
      kurenaishin: { title: '紅鎮', file: 'Kurenaishin.mp3' },
    };

    // ===== 譜面再生エンジンの状態 =====
    let currentChart   = null;        // 再生中の譜面オブジェクト
    let chartType      = 'piano';     // 'music' | 'piano'（ルール種別）
    let chartNotes     = [];          // マスターnote一覧（.spawnedフラグ付き）
    let chartPrevTime  = 0;           // ロング加点用の前フレーム時間
    let chartPlayStart = 0;           // ゲーム開始(カウント後)のperformance.now基準(秒)
    let chartPlayFrom  = 0;           // 再生開始の曲内時刻(秒・テストの途中開始用)
    let chartFromEditor = false;      // エディタのテストから起動したか（リザルトで戻り先を変える）
    let chartLeadIn    = 1.5;         // noteが降り始めるまでの猶予(秒)。開始時にBPMの1小節分で算出
    let chartAudioStarted = false;    // 音楽が実際に鳴り始めたか（鳴ったらノーツを音楽に同期）
    // ゲーム内経過時間(秒)。音楽再生後は音楽の再生位置に同期させて音ハメを保証する
    function chartTime() {
      if (chartAudioStarted) return chartLeadIn + (getSongTime() - chartPlayFrom);
      return performance.now() / 1000 - chartPlayStart;   // リードイン中(音楽が鳴る前)
    }
    const chartAudio   = new Audio(); // 譜面専用オーディオ（bgmAudioとは別）
    chartAudio.loop    = false;
    // audio.currentTimeは粗く更新されるため、performance.nowで補間して滑らかな曲時間を得る
    let songClockBaseAudio = 0;
    let songClockBasePerf  = 0;
    function getSongTime() {
      const audioT  = chartAudio.currentTime;
      const perfNow = performance.now() / 1000;
      if (Math.abs(audioT - songClockBaseAudio) > 1e-4) {
        songClockBaseAudio = audioT;       // 音声が進んだ→基準を更新
        songClockBasePerf  = perfNow;
        return audioT;
      }
      return songClockBaseAudio + (perfNow - songClockBasePerf);  // 補間
    }
    function stopChartAudio() { chartAudio.pause(); }

    // フレーム単位で滑らかに進む高精度クロック(秒)。requestAnimationFrameと同じ時間軸。
    const nowSec = () => performance.now() / 1000;

    function getFallDuration() {
      const elapsed   = nowSec() - musicStartTime;
      const speedMult = 1 + elapsed / SPEED_DOUBLE_SECS;
      return INITIAL_FALL_DURATION / speedMult;
    }

    function scheduleSpawn() {
      if (STATE !== 'playing' || (gameMode !== 'music' && gameMode !== 'piano')) return;
      spawnFallingNote();
      spawnTimerId = setTimeout(scheduleSpawn, getSpawnInterval());
    }

    // ===== 画面切り替え =====
    function setScreen(name) {
      Object.entries(screens).forEach(([key, el]) => {
        el.style.display = key === name ? 'flex' : 'none';
      });
    }

    // ===== グリッド寸法 =====
    function getRowHeight() {
      return laneContainer.offsetHeight / ROWS;
    }

    function getLaneWidth() {
      return laneContainer.offsetWidth / 4;
    }

    // ===== note要素を生成して指定行に配置 =====
    function createNoteEl(lane, row) {
      const rh = getRowHeight();
      const el = document.createElement('div');
      el.className = 'note';
      el.style.height = (rh - 8) + 'px';
      el.style.top    = (row * rh + 4) + 'px';
      laneEls[lane].appendChild(el);
      return el;
    }

    // ===== ゲーム開始時にグリッドを初期化 =====
    function initGrid() {
      // 4レーンをシャッフルして各行に割り当て（同じ行に複数出ない）
      const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
      grid = lanes.slice(0, ROWS).map((lane, row) => ({ lane, el: createNoteEl(lane, row) }));
    }

    // ===== タップ後にグリッドを1段進める =====
    // 呼び出し前に grid.pop() でタテ3(一番下)を削除済みであること
    function advanceGrid() {
      const rh = getRowHeight();

      // 残り3つ(タテ0〜2)をそれぞれ1段下へ移動
      grid.forEach((note, i) => {
        note.el.style.top = ((i + 1) * rh + 4) + 'px';
      });

      const newLane = Math.floor(Math.random() * 4);

      grid.unshift({ lane: newLane, el: createNoteEl(newLane, 0) });
    }

    // ===== ランク判定 =====
    function getRank(s, mode) {
      const m = mode === 'music' ? 50000 : mode === 'endless' ? 10 : mode === 'piano' ? 5 : 1;
      if (s < 30  * m) return { name: '八島',      image: 'pig.JPG' };
      if (s < 60  * m) return { name: 'アンマー族', image: null };
      if (s < 100 * m) return { name: '非発展',    image: 'homomaru.JPG' };
      if (s < 150 * m) return { name: '発展',      image: 'hiro.JPG' };
      if (s < 160 * m) return { name: '紫鳳',      image: 'sio.JPG' };
      return                   { name: '野駿',      image: 'kareshun.PNG' };
    }

    // ===== ゲームオーバー =====
    async function triggerGameOver(cleared = false) {
      STATE = 'gameover';
      cancelAnimationFrame(animFrameId);
      const goTitle = document.getElementById('gameover-title');
      goTitle.textContent = cleared ? 'CLEAR!' : 'GAME OVER';
      goTitle.style.color = cleared ? '#3de87a' : '';
      // ミュージック/譜面モードのクリーンアップ
      clearTimeout(spawnTimerId);
      spawnTimerId = null;
      chartAudio.pause();
      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      // スコアモードのクリーンアップ
      grid.forEach(note => note.el.remove());
      grid = [];
      // タイマーとヒットゾーンをリセット
      hudTimer.style.display = '';
      hudTimer.style.color = '';
      hudCombo.style.display = 'none';
      hudScore.classList.remove('music-score');
      laneContainer.classList.remove('lc8');
      document.getElementById('hit-zone').style.display = 'none';
      document.getElementById('hud-mode').textContent = '';
      finalScoreVal.textContent = score;
      const rank = getRank(score, gameMode);
      document.getElementById('final-rank-value').textContent = rank.name;
      const goScreen = document.getElementById('screen-gameover');
      if (rank.image) {
        goScreen.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("${rank.image}")`;
        goScreen.style.backgroundSize = 'cover';
        goScreen.style.backgroundPosition = 'center';
      } else {
        goScreen.style.backgroundImage = 'none';
      }
      setScreen('gameover');

      // テストから来た譜面は戻る先をエディタにする
      document.getElementById('btn-home').textContent =
        (gameMode === 'custom' && chartFromEditor) ? '譜面メーカーに戻る' : 'スタート画面へ';

      // 譜面モードはランキングを使わず結果のみ表示（MVP）
      if (gameMode === 'custom') {
        document.getElementById('ranking-title').textContent = (currentChart && currentChart.title) ? currentChart.title : '結果';
        document.getElementById('ranking-list').innerHTML = '';
        return;
      }

      // スコア保存 & ランキング表示
      document.getElementById('ranking-title').textContent =
        gameMode === 'music' ? 'ランキング（ミュージック）' :
        gameMode === 'endless' ? 'ランキング（エンドレシュン）' :
        gameMode === 'piano' ? 'ランキング（ピアノタイル）' :
        'ランキング（スコアアタック）';
      try {
        if (nickname) await saveScore(nickname, score, gameMode);
        const rankings = await loadRanking(gameMode);
        const list = document.getElementById('ranking-list');
        list.innerHTML = rankings.map((r, i) => {
          const isMe = r.nickname === nickname && r.score === score;
          const rank = getRank(r.score, gameMode);
          return `<li class="${isMe ? 'me' : ''}"><span>${i + 1}. ${r.nickname}</span><span>${r.score} ${rank.name}</span></li>`;
        }).join('');
      } catch (err) {
        console.error('ranking error:', err);
      }
    }

    // ===== ミス時: 赤点滅2回してからゲームオーバー =====
    function flashAndGameOver(tapLane, tapRow) {
      STATE = 'flashing';
      cancelAnimationFrame(animFrameId);
      playGaho();

      const rh = getRowHeight();
      const lw = getLaneWidth();
      const clampedLane = Math.max(0, Math.min(3, tapLane));
      const clampedRow  = Math.max(0, Math.min(ROWS - 1, tapRow));

      const flash = document.createElement('div');
      flash.style.cssText = [
        'position:absolute',
        `left:${clampedLane * lw + 4}px`,
        `top:${clampedRow * rh + 4}px`,
        `width:${lw - 8}px`,
        `height:${rh - 8}px`,
        'background:#f44',
        'border-radius:6px',
        'z-index:20',
        'animation:flashRed 0.25s ease 2',
        'pointer-events:none',
      ].join(';');
      laneContainer.appendChild(flash);

      flash.addEventListener('animationend', () => {
        flash.remove();
        triggerGameOver();
      });
    }

    // ===== レーンフラッシュ =====
    function flashLane(lane) {
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;inset:0;background:rgba(180,220,255,0.55);pointer-events:none;animation:flashTap 0.25s ease-out forwards;z-index:15;';
      laneEls[lane].appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
    // 譜面メーカー(8レーン)用フラッシュ。laneContainerに直接配置
    function flashCustomLane(lane) {
      const laneW = laneContainer.offsetWidth / 8;
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;top:0;bottom:0;background:rgba(180,220,255,0.55);pointer-events:none;animation:flashTap 0.25s ease-out forwards;z-index:15;left:' + (lane * laneW) + 'px;width:' + laneW + 'px;';
      laneContainer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    // ===== タップ判定 =====
    function handleInput(e) {
      if (STATE !== 'playing') return;
      e.preventDefault();

      const rect = laneContainer.getBoundingClientRect();
      const lw   = getLaneWidth();

      const points = e.changedTouches
        ? Array.from(e.changedTouches).map(t => ({
            x: t.clientX - rect.left,
            y: t.clientY - rect.top,
          }))
        : [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];

      if (gameMode === 'music' || gameMode === 'piano' || gameMode === 'custom') {
        const hitZoneTopY = laneContainer.offsetHeight * (1 - HIT_ZONE_RATIO);
        if (points[0].y < hitZoneTopY) return;
        if (gameMode === 'custom') {
          const laneW8 = laneContainer.offsetWidth / EDLANES;
          const tapLane = Math.max(0, Math.min(EDLANES - 1, Math.floor(points[0].x / laneW8)));
          flashCustomLane(tapLane);
          handleChartTap(tapLane);
          return;
        }
        const tapLane = Math.floor(points[0].x / lw);
        flashLane(tapLane);
        if (gameMode === 'piano') handlePianoTap(tapLane);
        else handleMusicTap(tapLane);
        return;
      }

      const rh = getRowHeight();
      let anyHit = false;
      for (const p of points) {
        const tapRow  = Math.floor(p.y / rh);
        const tapLane = Math.floor(p.x / lw);

        if (tapRow === ROWS - 1 && grid[ROWS - 1] && grid[ROWS - 1].lane === tapLane) {
          flashLane(tapLane);
          grid[ROWS - 1].el.remove();
          grid.pop();
          score++;
          hudScore.textContent = score;
          popScore();
          playTapSound();
          if (!timerStarted) { timerStarted = true; lastTimestamp = null; }
          advanceGrid();
          anyHit = true;
          break;
        }
      }

      if (!anyHit) {
        const p = points[0];
        flashAndGameOver(Math.floor(p.x / lw), Math.floor(p.y / rh));
      }
    }

    // ===== ゲームループ (タイマーのみ) =====
    function gameLoop(timestamp) {
      if (STATE !== 'playing') return;

      const rawDelta = lastTimestamp === null ? 0 : (timestamp - lastTimestamp) / 1000;
      const delta = Math.min(rawDelta, 0.1);
      lastTimestamp = timestamp;

      if (timerStarted) {
        elapsedTotal += delta;
        timeLeft -= delta;

        if (timeLeft <= 0) {
          timeLeft = 0;
          triggerGameOver();
          return;
        }
      }

      hudTimer.textContent = Math.ceil(timeLeft);
      hudTimer.classList.toggle('warning', timeLeft < 10);

      animFrameId = requestAnimationFrame(gameLoop);
    }

    // ===== エンドレシュンループ =====
    function endlessGameLoop(timestamp) {
      if (STATE !== 'playing') return;
      const rawDelta = lastTimestamp === null ? 0 : (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      elapsedTotal += Math.min(rawDelta, 0.1);
      hudTimer.textContent = Math.floor(elapsedTotal) + 's';
      animFrameId = requestAnimationFrame(endlessGameLoop);
    }

    // ===== エンドレシュン開始 =====
    function startEndlessGame() {
      audioCtx.resume();
      score         = 0;
      elapsedTotal  = 0;
      lastTimestamp = null;
      timerStarted  = true;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(note => note.el.remove());
      grid = [];

      hudScore.textContent = '0';
      hudScore.classList.remove('music-score');
      hudCombo.style.display = 'none';
      hudTimer.textContent = '0s';
      hudTimer.style.color = '#aaf';
      hudTimer.classList.remove('warning');
      hudTimer.style.display = '';
      document.getElementById('hit-zone').style.display = 'none';
      document.getElementById('hud-mode').textContent = 'ENDLESS';

      setScreen('game');
      STATE = 'playing';
      initGrid();
      animFrameId = requestAnimationFrame(endlessGameLoop);
    }

    // ===== スコアモード開始 =====
    function startGame() {
      audioCtx.resume();
      score         = 0;
      timeLeft      = TIME_LIMIT;
      elapsedTotal  = 0;
      lastTimestamp = null;
      timerStarted  = false;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(note => note.el.remove());
      grid = [];

      hudScore.textContent = '0';
      hudTimer.textContent = TIME_LIMIT;
      hudTimer.classList.remove('warning');
      hudTimer.style.color = '';
      hudTimer.style.display = '';
      document.getElementById('hit-zone').style.display = 'none';
      document.getElementById('hud-mode').textContent = '';

      setScreen('game');
      STATE = 'playing';
      initGrid();
      animFrameId = requestAnimationFrame(gameLoop);
    }

    // ===== ミュージックモード =====
    function stopBGM() {
      bgmAudio.pause();
      bgmAudio.currentTime = 0;
    }

    function takeDamage(lane, amount = 100) {
      combo = 0;
      hudCombo.textContent = '0';
      hp -= amount;
      hudTimer.textContent = 'HP ' + hp;
      if (hp <= 0) {
        stopBGM();
        flashAndGameOver(lane, ROWS - 1);
      } else {
        // 画面を一瞬赤くしてゲームは続行
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(255,68,68,0.35);z-index:100;pointer-events:none;animation:flashRed 0.3s ease 1;';
        document.body.appendChild(overlay);
        overlay.addEventListener('animationend', () => overlay.remove());
      }
    }

    function spawnFallingNote() {
      if (STATE !== 'playing') return;
      const screenH   = laneContainer.offsetHeight;
      const baseNoteH = Math.floor(screenH * NOTE_H_RATIO);
      const isLong    = gameMode === 'piano' && Math.random() < 1 / 10;
      const actualH   = isLong ? baseNoteH * (Math.floor(Math.random() * 5) + 2) : baseNoteH;
      let lane;
      do { lane = Math.floor(Math.random() * 4); } while (lane === lastSpawnLane);
      lastSpawnLane = lane;
      const rand = Math.random();
      const heal = gameMode === 'music' && rand < 1 / 50;
      const trap = gameMode === 'music' && !heal && rand < 1 / 50 + 1 / 30;
      const el = document.createElement('div');
      el.className = heal ? 'note note-heal' : trap ? 'note note-trap' : isLong ? 'note note-long' : 'note';
      el.style.height = actualH + 'px';
      el.style.top    = '0px';
      el.style.transform = 'translate3d(0,' + (-actualH) + 'px,0)';
      laneEls[lane].appendChild(el);
      fallingNotes.push({ lane, el, startTime: nowSec(), heal, trap, long: isLong, held: false, activated: false, noteH: actualH });
    }

    function musicGameLoop(ts) {
      if (STATE !== 'playing') return;
      const screenH    = laneContainer.offsetHeight;
      const fallSpeed  = screenH / getFallDuration();
      const noteH      = Math.floor(screenH * NOTE_H_RATIO);
      const now        = ts / 1000;

      let missedLane = -1;
      let trapAvoided = false;
      for (let i = fallingNotes.length - 1; i >= 0; i--) {
        const note    = fallingNotes[i];
        const noteTop = (now - note.startTime) * fallSpeed - noteH;
        note.el.style.transform = 'translate3d(0,' + noteTop + 'px,0)';
        if (noteTop > screenH) {
          note.el.remove();
          fallingNotes.splice(i, 1);
          if (note.trap) {
            trapAvoided = true;
          } else {
            missedLane = note.lane;
          }
        }
      }

      if (trapAvoided) {
        score += 10000;
        combo++;
        hudScore.textContent = score;
        hudCombo.textContent = combo;
        popScore();
      }
      if (missedLane >= 0) {
        takeDamage(missedLane);
        if (hp <= 0) return;
      }

      animFrameId = requestAnimationFrame(musicGameLoop);
    }

    function handleMusicTap(tapLane) {
      const screenH    = laneContainer.offsetHeight;
      const fallSpeed  = screenH / getFallDuration();
      const noteH      = Math.floor(screenH * NOTE_H_RATIO);
      const hitZoneTop = screenH * (1 - HIT_ZONE_RATIO);
      const now        = nowSec();

      for (let i = 0; i < fallingNotes.length; i++) {
        const note    = fallingNotes[i];
        const noteTop = (now - note.startTime) * fallSpeed - noteH;
        const noteBot = noteTop + noteH;
        if (note.lane === tapLane && noteBot > hitZoneTop && noteTop < screenH) {
          note.el.remove();
          fallingNotes.splice(i, 1);
          if (note.trap) {
            takeDamage(tapLane, 500);
            return;
          }
          if (note.heal) {
            hp = Math.min(hp + 200, 9999);
            hudTimer.textContent = 'HP ' + hp;
          } else {
            score += 10000;
            hudScore.textContent = score;
            popScore();
          }
          combo++;
          hudCombo.textContent = combo;
          playTapSound();
          return;
        }
      }
    }

    // ===== ピアノタイルループ =====
    function pianoGameLoop(ts) {
      if (STATE !== 'playing') return;
      const screenH   = laneContainer.offsetHeight;
      const fallSpeed = screenH / getFallDuration();
      const now       = ts / 1000;
      const delta     = Math.min(now - pianoPrevTime, 0.1);
      pianoPrevTime   = now;

      for (let i = fallingNotes.length - 1; i >= 0; i--) {
        const note    = fallingNotes[i];
        const noteTop = (now - note.startTime) * fallSpeed - note.noteH;
        note.el.style.transform = 'translate3d(0,' + noteTop + 'px,0)';

        if (note.long) {
          if (note.held) {
            score += Math.round(10000 * delta);
            hudScore.textContent = score;
          }
          if (noteTop > screenH) {
            note.el.remove();
            fallingNotes.splice(i, 1);
            if (!note.activated) {
              heldLongNote = null;
              stopBGM();
              flashAndGameOver(note.lane, ROWS - 1);
              return;
            }
            if (heldLongNote === note) heldLongNote = null;
          }
        } else {
          if (noteTop > screenH) {
            note.el.remove();
            fallingNotes.splice(i, 1);
            stopBGM();
            flashAndGameOver(note.lane, ROWS - 1);
            return;
          }
        }
      }
      animFrameId = requestAnimationFrame(pianoGameLoop);
    }

    function handlePianoTap(tapLane) {
      const screenH    = laneContainer.offsetHeight;
      const fallSpeed  = screenH / getFallDuration();
      const hitZoneTop = screenH * (1 - HIT_ZONE_RATIO);
      const now        = nowSec();

      for (let i = 0; i < fallingNotes.length; i++) {
        const note    = fallingNotes[i];
        const noteTop = (now - note.startTime) * fallSpeed - note.noteH;
        const noteBot = noteTop + note.noteH;
        if (note.lane === tapLane && noteBot > hitZoneTop && noteTop < screenH) {
          if (note.long) {
            if (!note.activated) {
              note.activated = true;
              note.held      = true;
              heldLongNote   = note;
              note.el.classList.add('held');
              playTapSound();
            }
            return;
          }
          note.el.remove();
          fallingNotes.splice(i, 1);
          score += 10000;
          hudScore.textContent = score;
          popScore();
          combo++;
          hudCombo.textContent = combo;
          playTapSound();
          return;
        }
      }
      stopBGM();
      flashAndGameOver(tapLane, ROWS - 1);
    }

    // ===== 譜面再生: ループ =====
    function chartGameLoop() {
      if (STATE !== 'playing') return;
      const screenH   = laneContainer.offsetHeight;
      const fallDur   = currentChart.noteSpeed || 0.6;   // 一定（加速なし）
      const fallSpeed = screenH / fallDur;
      const baseNoteH = Math.floor(screenH * NOTE_H_RATIO);
      const songTime  = chartTime();   // ゲーム開始からの経過(秒)。chartLeadIn後にnoteが到達
      const delta     = Math.min(songTime - chartPrevTime, 0.1);
      chartPrevTime   = songTime;

      // note到達時刻 = (t - 開始時刻) + リードイン。落ち始めはそこから fallDur 前
      for (const cn of chartNotes) {
        if (cn.spawned) continue;
        const noteStart = (cn.t - chartPlayFrom) + chartLeadIn - fallDur;
        if (noteStart <= songTime) {
          cn.spawned = true;
          const isLong = cn.type === 'long';
          const noteH  = isLong ? baseNoteH + cn.dur * fallSpeed : baseNoteH;
          const w      = cn.w || 1;
          const laneW  = laneContainer.offsetWidth / EDLANES;   // 8レーン
          const el = document.createElement('div');
          el.className = cn.type === 'heal'   ? 'note note-heal'
                       : cn.type === 'damage' ? 'note note-trap'
                       : isLong               ? 'note note-long' : 'note';
          el.style.height = noteH + 'px';
          el.style.top    = '0px';
          el.style.left   = (cn.lane * laneW + 2) + 'px';
          el.style.width  = (w * laneW - 4) + 'px';
          el.style.right  = 'auto';
          laneContainer.appendChild(el);   // 8レーン＋可変幅のため直接配置
          fallingNotes.push({ lane: cn.lane, w, el, noteStart, t: cn.t,
            type: cn.type, dur: cn.dur || 0, noteH, long: isLong, held: false, activated: false });
        }
      }

      // 位置更新 & 見逃し判定
      for (let i = fallingNotes.length - 1; i >= 0; i--) {
        const note    = fallingNotes[i];
        const noteTop = (songTime - note.noteStart) * fallSpeed - note.noteH;
        note.el.style.transform = 'translate3d(0,' + noteTop + 'px,0)';

        if (note.long && note.held) {
          score += Math.round(10000 * delta);
          hudScore.textContent = score;
        }

        if (noteTop > screenH) {              // 最下部を通過
          note.el.remove();
          fallingNotes.splice(i, 1);
          if (note.type === 'long') {
            if (!note.activated) {            // ロング未タップ = ミス
              if (chartType === 'piano') { stopChartAudio(); flashAndGameOver(note.lane, ROWS - 1); return; }
              else { takeDamage(note.lane); if (hp <= 0) return; }
            } else if (heldLongNote === note) { heldLongNote = null; }
          } else if (note.type === 'normal') {
            if (chartType === 'piano') { stopChartAudio(); flashAndGameOver(note.lane, ROWS - 1); return; }
            else { takeDamage(note.lane); if (hp <= 0) return; }
          }
          // heal/damage は見逃しても無害（回避できたとみなす）
        }
      }

      // 全note消化＝クリア → 結果画面へ
      if (fallingNotes.length === 0 && chartNotes.every(c => c.spawned)) {
        stopChartAudio();
        if (!chartFromEditor && currentChart && currentChart.id) bumpChartStat(currentChart.id, 'clears');
        triggerGameOver(true);
        return;
      }

      animFrameId = requestAnimationFrame(chartGameLoop);
    }

    // ===== 譜面再生: タップ判定 =====
    function handleChartTap(tapLane) {
      const screenH    = laneContainer.offsetHeight;
      const fallDur    = currentChart.noteSpeed || 0.6;
      const fallSpeed  = screenH / fallDur;
      const hitZoneTop = screenH * (1 - HIT_ZONE_RATIO);
      const songTime   = chartTime();

      for (let i = 0; i < fallingNotes.length; i++) {
        const note    = fallingNotes[i];
        const noteTop = (songTime - note.noteStart) * fallSpeed - note.noteH;
        const noteBot = noteTop + note.noteH;
        const w = note.w || 1;
        if (tapLane >= note.lane && tapLane <= note.lane + w - 1 && noteBot > hitZoneTop && noteTop < screenH) {
          if (note.type === 'long') {
            if (!note.activated) {
              note.activated = true; note.held = true; heldLongNote = note;
              note.el.classList.add('held'); playTapSound();
            }
            return;
          }
          note.el.remove();
          fallingNotes.splice(i, 1);
          if (note.type === 'damage') { takeDamage(tapLane, 500); return; }
          if (note.type === 'heal') {
            hp = Math.min(hp + 200, 9999);
            hudTimer.textContent = 'HP ' + hp;
            combo++; hudCombo.textContent = combo; playTapSound();
            return;
          }
          score += 10000; hudScore.textContent = score; popScore();
          combo++; hudCombo.textContent = combo; playTapSound();
          return;
        }
      }
      // どのnoteにも当たらなかった: ピアノ型は即ゲームオーバー、ミュージック型は無害
      if (chartType === 'piano') { stopChartAudio(); flashAndGameOver(tapLane, ROWS - 1); }
    }

    // ===== 譜面再生: 開始（fromTimeで途中開始＝テストプレイに対応）=====
    function startChartGame(chart, fromTime = 0) {
      audioCtx.resume();
      stopBGM();
      currentChart = chart;
      gameMode     = 'custom';
      chartType    = chart.chartType || 'piano';

      score = 0; hp = 1000; combo = 0; heldLongNote = null;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(n => n.el.remove());
      grid = [];
      clearTimeout(spawnTimerId);

      chartPlayFrom = fromTime;
      chartLeadIn   = 4 * 60 / (chart.bpm || 120);   // BPMの1小節分(4拍)
      // マスター一覧を構築（時刻順、fromTimeより前のnoteは出現済み扱いでスキップ）
      chartNotes = chart.notes
        .map(n => ({ lane: n.lane, t: n.t, type: n.type, dur: n.dur || 0, w: n.w || 1, spawned: n.t < fromTime }))
        .sort((a, b) => a.t - b.t);

      hudScore.textContent = '0';
      hudScore.classList.add('music-score');
      hudCombo.textContent = '0';
      hudCombo.style.display = 'block';
      if (chartType === 'music') {
        hudTimer.textContent = 'HP 1000';
        hudTimer.style.color = '#f55';
        hudTimer.classList.remove('warning');
        hudTimer.style.display = '';
      } else {
        hudTimer.style.display = 'none';
      }
      document.getElementById('hit-zone').style.display = 'block';
      document.getElementById('hud-mode').textContent = chart.title || 'CUSTOM';
      laneContainer.classList.add('lc8');   // 8レーン表示(4レーン境界線を隠す)

      const song = SONGS[chart.songId] || SONGS[Object.keys(SONGS)[0]];
      chartAudio.src = song.file;
      chartAudio.load();

      setScreen('game');
      STATE = 'countdown';

      const countEl = document.createElement('div');
      countEl.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:900;color:#fff;z-index:200;pointer-events:none;text-shadow:0 0 24px rgba(0,0,0,0.9);';
      countEl.textContent = '2';
      document.body.appendChild(countEl);

      setTimeout(() => { countEl.textContent = '1'; }, 1000);
      setTimeout(() => {
        countEl.remove();
        STATE = 'playing';
        chartPlayStart   = performance.now() / 1000;   // リードイン中の時計の基準
        chartPrevTime    = 0;
        chartAudioStarted = false;
        animFrameId = requestAnimationFrame(chartGameLoop);
        // リードインぶん待ってから曲を再生。鳴り始めたらノーツを音楽に同期
        setTimeout(() => {
          if (STATE !== 'playing' || gameMode !== 'custom') return;
          try { chartAudio.currentTime = fromTime; } catch (e) {}
          songClockBaseAudio = fromTime;
          songClockBasePerf  = performance.now() / 1000;
          chartAudio.play().then(() => { chartAudioStarted = true; }).catch(console.error);
        }, chartLeadIn * 1000);
      }, 2000);
    }

    // ===== ピアノタイル開始 =====
    function startPianoGame() {
      audioCtx.resume();
      playBGM();

      score         = 0;
      lastSpawnLane = -1;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(note => note.el.remove());
      grid = [];
      clearTimeout(spawnTimerId);

      combo         = 0;
      heldLongNote  = null;

      hudScore.textContent = '0';
      hudScore.classList.add('music-score');
      hudCombo.textContent = '0';
      hudCombo.style.display = 'block';
      hudTimer.style.display = 'none';
      document.getElementById('hit-zone').style.display = 'block';
      document.getElementById('hud-mode').textContent = 'PIANO TILES';

      setScreen('game');
      STATE = 'countdown';

      const countEl = document.createElement('div');
      countEl.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:900;color:#fff;z-index:200;pointer-events:none;text-shadow:0 0 24px rgba(0,0,0,0.9);';
      countEl.textContent = '2';
      document.body.appendChild(countEl);

      setTimeout(() => { countEl.textContent = '1'; }, 1000);
      setTimeout(() => {
        countEl.remove();
        STATE = 'playing';
        musicStartTime = nowSec();
        pianoPrevTime  = nowSec();
        scheduleSpawn();
        animFrameId = requestAnimationFrame(pianoGameLoop);
      }, 2000);
    }

    function startMusicGame() {
      audioCtx.resume();

      score         = 0;
      hp            = 1000;
      lastSpawnLane = -1;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(note => note.el.remove());
      grid = [];
      clearTimeout(spawnTimerId);

      combo = 0;
      hudScore.textContent = '0';
      hudScore.classList.add('music-score');
      hudCombo.textContent = '0';
      hudCombo.style.display = 'block';
      hudTimer.textContent = 'HP 1000';
      hudTimer.style.color = '#f55';
      hudTimer.classList.remove('warning');
      hudTimer.style.display = '';
      document.getElementById('hit-zone').style.display = 'block';
      document.getElementById('hud-mode').textContent = 'MUSIC';

      setScreen('game');
      STATE = 'countdown';

      const countEl = document.createElement('div');
      countEl.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:900;color:#fff;z-index:200;pointer-events:none;text-shadow:0 0 24px rgba(0,0,0,0.9);';
      countEl.textContent = '2';
      document.body.appendChild(countEl);

      setTimeout(() => { countEl.textContent = '1'; }, 1000);
      setTimeout(() => {
        countEl.remove();
        STATE = 'playing';
        musicStartTime = nowSec();
        scheduleSpawn();
        animFrameId = requestAnimationFrame(musicGameLoop);
      }, 2000);
    }

    function restartGame() {
      if (gameMode === 'music') startMusicGame();
      else if (gameMode === 'endless') startEndlessGame();
      else if (gameMode === 'piano') startPianoGame();
      else if (gameMode === 'custom') startChartGame(currentChart, chartPlayFrom);
      else startGame();
    }

    // ===== キーボード入力 (D=0, F=1, J=2, K=3) =====
    const KEY_LANE = { d: 0, f: 1, j: 2, k: 3 };
    const KEY_LANE8 = { a: 0, s: 1, d: 2, f: 3, j: 4, k: 5, l: 6, ';': 7 };  // 譜面メーカー(8レーン)

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (STATE === 'start') {
          nickname = document.getElementById('nickname-input').value.trim();
          restartGame();
        } else if (STATE === 'gameover') {
          if (gameMode === 'music') { bgmAudio.currentTime = 0; bgmAudio.play(); }
          restartGame();
        }
        return;
      }
      if (STATE !== 'playing') return;

      if (gameMode === 'custom') {              // 8レーン: a s d f j k l ;
        const lane8 = KEY_LANE8[e.key.toLowerCase()];
        if (lane8 === undefined) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        flashCustomLane(lane8);
        handleChartTap(lane8);
        return;
      }

      const lane = KEY_LANE[e.key.toLowerCase()];
      if (lane === undefined) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (gameMode === 'music' || gameMode === 'piano') {
        flashLane(lane);
        if (gameMode === 'piano') handlePianoTap(lane);
        else handleMusicTap(lane);
        return;
      }

      const bottomNote = grid[ROWS - 1];
      if (bottomNote && bottomNote.lane === lane) {
        flashLane(lane);
        bottomNote.el.remove();
        grid.pop();
        score++;
        hudScore.textContent = score;
        popScore();
        playTapSound();
        if (!timerStarted) { timerStarted = true; lastTimestamp = null; }
        advanceGrid();
      } else {
        flashAndGameOver(lane, ROWS - 1);
      }
    });

    // ===== イベント登録 =====
    function checkNicknameAndStart() {
      nickname = document.getElementById('nickname-input').value.trim();
      startGame();
    }

    document.getElementById('btn-mode-score').addEventListener('click', () => {
      gameMode = 'score';
      document.getElementById('btn-mode-score').classList.add('active');
      document.getElementById('btn-mode-endless').classList.remove('active');
      document.getElementById('btn-mode-music').classList.remove('active');
      document.getElementById('btn-mode-piano').classList.remove('active');
      checkNicknameAndStart();
    });

    function playBGM() {
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(console.error);
    }

    document.getElementById('btn-mode-endless').addEventListener('click', () => {
      gameMode = 'endless';
      document.getElementById('btn-mode-endless').classList.add('active');
      document.getElementById('btn-mode-score').classList.remove('active');
      document.getElementById('btn-mode-music').classList.remove('active');
      document.getElementById('btn-mode-piano').classList.remove('active');
      nickname = document.getElementById('nickname-input').value.trim();
      startEndlessGame();
    });

    document.getElementById('btn-mode-music').addEventListener('click', () => {
      gameMode = 'music';
      document.getElementById('btn-mode-music').classList.add('active');
      document.getElementById('btn-mode-score').classList.remove('active');
      document.getElementById('btn-mode-endless').classList.remove('active');
      document.getElementById('btn-mode-piano').classList.remove('active');
      nickname = document.getElementById('nickname-input').value.trim();
      playBGM();
      startMusicGame();
    });

    document.getElementById('btn-mode-piano').addEventListener('click', () => {
      gameMode = 'piano';
      document.getElementById('btn-mode-piano').classList.add('active');
      document.getElementById('btn-mode-score').classList.remove('active');
      document.getElementById('btn-mode-endless').classList.remove('active');
      document.getElementById('btn-mode-music').classList.remove('active');
      nickname = document.getElementById('nickname-input').value.trim();
      startPianoGame();
    });

    document.getElementById('btn-mode-maker').addEventListener('click', () => {
      nickname = document.getElementById('nickname-input').value.trim();
      openDrafts();
    });
    document.getElementById('drafts-new').addEventListener('click', newDraft);
    document.getElementById('drafts-back').addEventListener('click', () => {
      STATE = 'start';
      setScreen('start');
    });

    document.getElementById('btn-retry').addEventListener('click', () => {
      if (gameMode === 'music' || gameMode === 'piano') playBGM();
      restartGame();
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      stopBGM();
      stopChartAudio();
      if (gameMode === 'custom' && chartFromEditor) { openEditor(); return; }
      STATE = 'start';
      setScreen('start');
    });

    function handlePianoRelease() {
      if (heldLongNote) {
        heldLongNote.held = false;
        heldLongNote.el.classList.remove('held');
        heldLongNote = null;
      }
    }

    laneContainer.addEventListener('touchstart', handleInput, { passive: false });
    laneContainer.addEventListener('mousedown', handleInput);
    laneContainer.addEventListener('touchend',  () => { if (gameMode === 'piano' || gameMode === 'custom') handlePianoRelease(); }, { passive: false });
    laneContainer.addEventListener('mouseup',   () => { if (gameMode === 'piano' || gameMode === 'custom') handlePianoRelease(); });

    // ============================================================
    // ===== 譜面メーカー（エディタ）=====
    // ============================================================
    const EDITOR_PX_PER_SEC = 400;   // 縦1秒あたりのピクセル
    const EDITOR_NOTE_H     = 24;    // 通常noteの表示高さ(px)
    const EDLANES           = 8;     // 譜面メーカーのレーン数（本編は4のまま）

    let editorChart    = null;   // {title, songId, chartType, bpm, offset, noteSpeed, notes:[]}
    let editorDraftId  = null;   // 編集中の下書きID（localStorage上）。新規はnull
    let editorNoteType = 'normal';
    let editorWidth    = 1;      // 配置するnoteの横幅(レーン数 1〜4)
    let editorSubdiv   = 4;      // 4 | 8 | 16
    let editorLongStart= null;   // （旧）未使用
    let edDrag         = null;   // ドラッグ操作中 {type:'create-long'|'move'|'resize-end', note, lane, startT, endT, grabOffsetT, lastClientX, lastClientY, raf}
    let edPress        = null;   // 押下〜判定前 {lane, startClientY, y, hit, tailZone, timer, moved}
    let edHistory      = [];     // 編集履歴(notesのJSONスナップショット)
    let edHistoryIdx   = -1;     // 現在位置
    let editorPlaying  = false;
    let editorPreviewRAF = null;
    let editorGridH    = 0;      // 現在のグリッド全体の高さ(px)。縦軸は下=時間0, 上=後

    // DOM参照
    const edSong    = document.getElementById('ed-song');
    const edType    = document.getElementById('ed-type');
    const edBpm     = document.getElementById('ed-bpm');
    const edOffset  = document.getElementById('ed-offset');
    const edScroll  = document.getElementById('editor-scroll');
    const edGrid    = document.getElementById('editor-grid');
    const edLines   = document.getElementById('editor-lines');
    const edNowline = document.getElementById('editor-nowline');
    const edStartline = document.getElementById('editor-startline');
    const edPalette = document.getElementById('editor-palette');
    const edPlay    = document.getElementById('ed-play');
    const edUndoBtn = document.getElementById('ed-undo');
    const edRedoBtn = document.getElementById('ed-redo');
    const edNotes   = document.getElementById('editor-notes');
    function edLaneW() { return edGrid.clientWidth / EDLANES; }   // 1レーンの幅(px)

    // 曲選択の選択肢を生成
    Object.entries(SONGS).forEach(([id, s]) => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = s.title;
      edSong.appendChild(opt);
    });

    // ----- 時間↔ピクセル / スナップ -----
    function edBeat()    { return 60 / editorChart.bpm; }
    function edCellSec() { return edBeat() * 4 / editorSubdiv; }
    // 縦軸は反転: 時間0=一番下、時間が進むほど上（落下と同じ向き）
    function yLine(t)    { return editorGridH - t * EDITOR_PX_PER_SEC; }
    function tAtY(y)     { return (editorGridH - y) / EDITOR_PX_PER_SEC; }
    function snapT(t) {
      const c = edCellSec(), off = editorChart.offset;
      return Math.max(0, Math.round((t - off) / c) * c + off);
    }
    function songDuration() {
      return (chartAudio.duration && isFinite(chartAudio.duration)) ? chartAudio.duration : 90;
    }

    // ----- グリッド寸法と拍線の再描画 -----
    function layoutEditorGrid() {
      const h = Math.max(edScroll.clientHeight, songDuration() * EDITOR_PX_PER_SEC);
      editorGridH = h;
      edGrid.style.height = h + 'px';
      edStartline.style.top = (yLine(0) - 4) + 'px';   // 一番下=時間0=スタート(判定)位置
      // 拍線
      edLines.innerHTML = '';
      const cell = edCellSec(), off = editorChart.offset;
      const cellsPerBeat    = editorSubdiv / 4;      // 4→1, 8→2, 16→4
      const cellsPerMeasure = editorSubdiv;          // 4拍ぶん
      let r = 0;
      for (let t = off; t * EDITOR_PX_PER_SEC <= h; t = off + (++r) * cell) {
        if (t < 0) continue;
        const line = document.createElement('div');
        line.className = 'ed-beatline' +
          (r % cellsPerMeasure === 0 ? ' measure' : r % cellsPerBeat === 0 ? ' beat' : '');
        line.style.top = yLine(t) + 'px';
        edLines.appendChild(line);
      }
      renderEditorNotes();
    }

    // ----- note描画（配列から再構築。重ね層に絶対配置・横幅対応）-----
    function setNoteX(el, lane, w) {
      const lw = edLaneW();
      el.style.left  = (lane * lw + 2) + 'px';
      el.style.width = (w * lw - 4) + 'px';
    }
    function renderEditorNotes() {
      edNotes.innerHTML = '';
      for (const n of editorChart.notes) {
        const el = document.createElement('div');
        el.className = 'ed-note' +
          (n.type === 'long' ? ' ed-note-long' : n.type === 'heal' ? ' ed-note-heal' : n.type === 'damage' ? ' ed-note-damage' : '') +
          (edDrag && edDrag.note === n ? ' ed-grabbed' : '');
        if (n.type === 'long') {
          const dh = Math.max(8, n.dur * EDITOR_PX_PER_SEC);
          el.style.top = (yLine(n.t) - dh) + 'px';   // headが下端、tailが上
          el.style.height = dh + 'px';
        } else {
          el.style.top = (yLine(n.t) - EDITOR_NOTE_H) + 'px';
          el.style.height = EDITOR_NOTE_H + 'px';
        }
        setNoteX(el, n.lane, n.w || 1);
        edNotes.appendChild(el);
      }
      if (edDrag && edDrag.type === 'create-long') {
        const dur  = Math.max(edCellSec(), edDrag.endT - edDrag.startT);
        const dh   = Math.max(8, dur * EDITOR_PX_PER_SEC);
        const el = document.createElement('div');
        el.className = 'ed-note ed-note-long ed-pending';
        el.style.top = (yLine(edDrag.startT) - dh) + 'px';
        el.style.height = dh + 'px';
        setNoteX(el, edDrag.lane, edDrag.w || 1);
        edNotes.appendChild(el);
      }
    }

    // ----- 編集履歴（戻す/進む）-----
    function pushHistory() {
      edHistory = edHistory.slice(0, edHistoryIdx + 1);
      edHistory.push(JSON.stringify(editorChart.notes));
      edHistoryIdx = edHistory.length - 1;
      updateUndoRedo();
    }
    function resetHistory() {
      edHistory = [JSON.stringify(editorChart.notes)];
      edHistoryIdx = 0;
      updateUndoRedo();
    }
    function applyHistory() {
      editorChart.notes = JSON.parse(edHistory[edHistoryIdx]);
      renderEditorNotes();
      updateUndoRedo();
    }
    function edUndo() { if (edHistoryIdx > 0) { edHistoryIdx--; applyHistory(); } }
    function edRedo() { if (edHistoryIdx < edHistory.length - 1) { edHistoryIdx++; applyHistory(); } }
    function updateUndoRedo() {
      edUndoBtn.disabled = edHistoryIdx <= 0;
      edRedoBtn.disabled = edHistoryIdx >= edHistory.length - 1;
    }

    // ----- パレット -----
    function rebuildPalette() {
      const types = editorChart.chartType === 'music'
        ? [['normal','ノーマル'],['heal','回復'],['damage','ダメージ']]
        : [['normal','ノーマル'],['long','ロング']];
      edPalette.innerHTML = '';
      types.forEach(([key, label]) => {
        const b = document.createElement('button');
        b.className = 'ed-pal' + (editorNoteType === key ? ' active' : '');
        b.textContent = label;
        b.onclick = () => setEditorNoteType(key);
        edPalette.appendChild(b);
      });
      const er = document.createElement('button');
      er.className = 'ed-pal' + (editorNoteType === 'eraser' ? ' active' : '');
      er.textContent = '消しゴム';
      er.onclick = () => setEditorNoteType('eraser');
      edPalette.appendChild(er);

      const clr = document.createElement('button');
      clr.className = 'ed-pal ed-pal-clear';
      clr.textContent = '全削除';
      clr.onclick = () => {
        if (editorChart.notes.length === 0) return;
        if (confirm('作成中の譜面を全部消します。よろしいですか？')) {
          editorChart.notes = [];
          cancelLongDrag();
          renderEditorNotes();
          pushHistory();
        }
      };
      edPalette.appendChild(clr);
    }
    function setEditorNoteType(t) {
      editorNoteType = t;
      cancelLongDrag();
      edScroll.classList.toggle('ed-noscroll', t === 'long');  // ロング中はタッチscroll停止(自前scroll)
      rebuildPalette();
      renderEditorNotes();
    }

    // ----- note配置/削除 -----
    function findNoteAt(lane, t) {
      return editorChart.notes.find(n => n.lane === lane && Math.abs(n.t - t) < edCellSec() / 2);
    }
    function removeNoteAt(lane, t) {
      const n = findNoteAt(lane, t);
      if (n) editorChart.notes.splice(editorChart.notes.indexOf(n), 1);
    }
    // 指定レーン・y(グリッド内)にあるnoteを探す。tail=ロングの上端(終端)付近か
    function hitTestNote(lane, y) {
      const PAD = 6;
      for (const n of editorChart.notes) {
        const w = n.w || 1;
        if (lane < n.lane || lane > n.lane + w - 1) continue;
        let top, bottom;
        if (n.type === 'long') { top = yLine(n.t + n.dur); bottom = yLine(n.t); }
        else { top = yLine(n.t) - EDITOR_NOTE_H; bottom = yLine(n.t); }
        if (y >= top - PAD && y <= bottom + PAD) {
          const tail = n.type === 'long' && y <= top + (bottom - top) * 0.35;
          return { note: n, tail };
        }
      }
      return null;
    }

    const LONGPRESS_MS = 320;

    // 既存noteを長押しでつかむ → 移動 or （ロング上端で）伸縮
    function beginGrab() {
      if (!edPress) return;
      const hit = edPress.hit;
      edScroll.classList.add('ed-noscroll');     // つかみ中はタッチscroll停止
      if (hit.note.type === 'long' && edPress.tailZone) {
        edDrag = { type: 'resize-end', note: hit.note, lane: hit.note.lane };
      } else {
        const grabT = tAtY(edPress.y);
        edDrag = { type: 'move', note: hit.note, lane: hit.note.lane, grabOffsetT: hit.note.t - grabT };
      }
      edDrag.lastClientX = edPress.lastClientX;
      edDrag.lastClientY = edPress.startClientY;
      edPress = null;
      edDrag.raf = requestAnimationFrame(dragLoop);
      renderEditorNotes();
    }

    // クリックX座標→レーン番号(0〜7)。幅wぶん右にはみ出さないよう制限
    function laneFromClientX(clientX, w = 1) {
      const gRect = edGrid.getBoundingClientRect();
      let lane = Math.floor((clientX - gRect.left) / (gRect.width / EDLANES));
      return Math.max(0, Math.min(EDLANES - w, lane));
    }

    // ロング新規作成ドラッグを開始
    function beginCreateLong(lane, y, clientX, clientY) {
      const t = snapT(tAtY(y));
      edDrag = { type: 'create-long', lane, w: editorWidth, startT: t, endT: t, lastClientX: clientX, lastClientY: clientY };
      edDrag.raf = requestAnimationFrame(dragLoop);
      renderEditorNotes();
    }

    // ドラッグ中ループ（端で自動スクロール）
    function dragLoop() {
      if (!edDrag) return;
      const sRect = edScroll.getBoundingClientRect();
      const EDGE = 70, SPEED = 16;
      const maxScroll = Math.max(0, editorGridH - edScroll.clientHeight);
      if (edDrag.lastClientY < sRect.top + EDGE)         edScroll.scrollTop = Math.max(0, edScroll.scrollTop - SPEED);
      else if (edDrag.lastClientY > sRect.bottom - EDGE) edScroll.scrollTop = Math.min(maxScroll, edScroll.scrollTop + SPEED);

      const gRect = edGrid.getBoundingClientRect();
      const pointerT = tAtY(edDrag.lastClientY - gRect.top);

      if (edDrag.type === 'create-long') {
        edDrag.endT = snapT(pointerT);
      } else if (edDrag.type === 'resize-end') {
        edDrag.note.dur = Math.max(edCellSec(), snapT(pointerT) - edDrag.note.t);
      } else if (edDrag.type === 'move') {
        edDrag.note.lane = laneFromClientX(edDrag.lastClientX, edDrag.note.w || 1);
        edDrag.note.t    = snapT(pointerT + edDrag.grabOffsetT);
      }
      renderEditorNotes();
      edDrag.raf = requestAnimationFrame(dragLoop);
    }

    function onPadPointerDown(e) {
      if (editorPlaying) return;
      const gRect = edGrid.getBoundingClientRect();
      const y = e.clientY - gRect.top;
      const rawLane = Math.max(0, Math.min(EDLANES - 1, Math.floor((e.clientX - gRect.left) / (gRect.width / EDLANES))));
      const hit = hitTestNote(rawLane, y);
      edPress = { lane: rawLane, startClientY: e.clientY, lastClientX: e.clientX, y, hit, tailZone: hit ? hit.tail : false, timer: null, moved: false };

      if (hit) {
        edPress.timer = setTimeout(beginGrab, LONGPRESS_MS);  // 既存note: 長押しで移動/伸縮
      } else if (editorNoteType === 'long') {
        e.preventDefault();                                   // 空白×ロング: すぐ作成ドラッグ
        const lane = laneFromClientX(e.clientX, editorWidth);
        edPress = null;
        beginCreateLong(lane, y, e.clientX, e.clientY);
      }
    }
    function onPadPointerMove(e) {
      if (edDrag) {
        e.preventDefault();
        edDrag.lastClientX = e.clientX;
        edDrag.lastClientY = e.clientY;
      } else if (edPress) {
        edPress.lastClientX = e.clientX;
        if (Math.abs(e.clientY - edPress.startClientY) > 8) {
          edPress.moved = true;                 // スクロール等 → 長押しキャンセル
          clearTimeout(edPress.timer);
        }
      }
    }
    function onPadPointerUp() {
      if (edDrag) { finishDrag(); return; }
      if (!edPress) return;
      clearTimeout(edPress.timer);
      if (!edPress.moved) {                      // クイックタップ
        const t = snapT(tAtY(edPress.y));
        const lane = Math.min(edPress.lane, EDLANES - editorWidth);  // 幅ぶん右にはみ出さない
        let changed = false;
        if (editorNoteType === 'eraser') {
          if (edPress.hit) { editorChart.notes.splice(editorChart.notes.indexOf(edPress.hit.note), 1); changed = true; }
        } else if (editorNoteType === 'long') {
          if (!edPress.hit) { editorChart.notes.push({ lane, t, type: 'long', dur: edCellSec(), w: editorWidth }); changed = true; }
        } else {
          if (edPress.hit) editorChart.notes.splice(editorChart.notes.indexOf(edPress.hit.note), 1);  // 配置⇔削除
          else editorChart.notes.push({ lane, t, type: editorNoteType, w: editorWidth });
          changed = true;
        }
        if (changed) { renderEditorNotes(); pushHistory(); }
      }
      edPress = null;
    }
    function finishDrag() {
      if (edDrag.raf) cancelAnimationFrame(edDrag.raf);
      if (edDrag.type === 'create-long') {
        const dur = Math.max(edCellSec(), edDrag.endT - edDrag.startT);
        editorChart.notes.push({ lane: edDrag.lane, t: edDrag.startT, type: 'long', dur, w: edDrag.w || 1 });
      }
      edDrag = null;
      edScroll.classList.toggle('ed-noscroll', editorNoteType === 'long');  // ロング時のみnoscroll維持
      renderEditorNotes();
      pushHistory();
    }
    function cancelLongDrag() {
      if (edDrag && edDrag.raf) cancelAnimationFrame(edDrag.raf);
      if (edPress) clearTimeout(edPress.timer);
      edDrag = null;
      edPress = null;
    }

    edGrid.addEventListener('pointerdown', onPadPointerDown);
    document.addEventListener('pointermove', onPadPointerMove, { passive: false });
    document.addEventListener('pointerup', onPadPointerUp);
    document.addEventListener('pointercancel', () => { if (edDrag) finishDrag(); else if (edPress) { clearTimeout(edPress.timer); edPress = null; } });

    // ----- メタ情報をコントロールから同期 -----
    function syncEditorMeta() {
      editorChart.songId    = edSong.value;
      editorChart.chartType = edType.value;
      editorChart.bpm       = Math.max(30, Math.min(400, parseInt(edBpm.value, 10) || 120));
      editorChart.offset    = parseFloat(edOffset.value) || 0;
    }

    // 一番下（時間0）が見えるようスクロール
    function scrollEditorToStart() {
      edScroll.scrollTop = Math.max(0, editorGridH - edScroll.clientHeight);
    }

    // ----- 曲読み込み -----
    function loadEditorSong() {
      const song = SONGS[editorChart.songId] || SONGS[Object.keys(SONGS)[0]];
      chartAudio.src = song.file;
      chartAudio.load();
      chartAudio.onloadedmetadata = () => { layoutEditorGrid(); if (!editorPlaying) scrollEditorToStart(); };
      layoutEditorGrid();
    }

    // ----- エディタを開く -----
    // ----- 下書き（この端末に保存。複数を並行管理）-----
    const DRAFTS_KEY = 'humen_drafts';
    function loadDrafts() {
      try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]'); }
      catch (e) { return []; }
    }
    function saveDrafts(arr) {
      try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(arr)); }
      catch (e) { console.error('draft save error:', e); alert('下書きの保存に失敗しました（保存容量不足かも）'); }
    }
    function autoSaveDraft() {   // 編集中の譜面を下書きへ反映（noteが空なら何もしない）
      if (!editorChart || editorChart.notes.length === 0) return;
      syncEditorMeta();
      const data = {
        title: editorChart.title || '', songId: editorChart.songId, chartType: editorChart.chartType,
        bpm: editorChart.bpm, offset: editorChart.offset, noteSpeed: editorChart.noteSpeed || 0.6,
        notes: editorChart.notes.map(n => ({ lane: n.lane, t: n.t, type: n.type, dur: n.dur || 0, w: n.w || 1 })),
        updated: Date.now(),
      };
      const drafts = loadDrafts();
      if (!editorDraftId) editorDraftId = 'd' + Date.now() + Math.random().toString(36).slice(2, 6);
      const i = drafts.findIndex(d => d.id === editorDraftId);
      if (i >= 0) drafts[i] = { ...data, id: editorDraftId };
      else drafts.push({ ...data, id: editorDraftId });
      saveDrafts(drafts);
    }
    function openDrafts() {
      stopBGM(); stopChartAudio(); stopEditorPreview();
      STATE = 'drafts';
      setScreen('drafts');
      const list = document.getElementById('drafts-list');
      const drafts = loadDrafts().sort((a, b) => (b.updated || 0) - (a.updated || 0));
      if (drafts.length === 0) { list.innerHTML = '<div class="browse-empty">作りかけはありません。「＋新規作成」から作れます</div>'; return; }
      list.innerHTML = '';
      drafts.forEach(d => {
        const song = SONGS[d.songId];
        const row = document.createElement('div');
        row.className = 'browse-item';
        const open = document.createElement('button');
        open.className = 'bi-play';
        const dateStr = d.updated ? new Date(d.updated).toLocaleDateString() : '';
        open.innerHTML =
          `<span class="bi-title">${escapeHtml(d.title || '無題')}</span>` +
          `<span class="bi-sub">${d.chartType === 'music' ? 'ミュージック' : 'ピアノ'} / ${escapeHtml(song ? song.title : d.songId)} / ノーツ${d.notes ? d.notes.length : 0} / ${dateStr}</span>`;
        open.addEventListener('click', () => editDraft(d));
        row.appendChild(open);
        const del = document.createElement('button');
        del.className = 'bi-del';
        del.textContent = '🗑';
        del.addEventListener('click', () => {
          if (!confirm(`下書き「${d.title || '無題'}」を削除しますか？`)) return;
          saveDrafts(loadDrafts().filter(x => x.id !== d.id));
          row.remove();
        });
        row.appendChild(del);
        list.appendChild(row);
      });
    }
    function editDraft(d) {
      editorChart = {
        title: d.title || '', songId: d.songId, chartType: d.chartType,
        bpm: d.bpm, offset: d.offset, noteSpeed: d.noteSpeed || 0.6,
        notes: (d.notes || []).map(n => ({ lane: n.lane, t: n.t, type: n.type, dur: n.dur || 0, w: n.w || 1 })),
      };
      editorDraftId = d.id;
      openEditor();
    }
    function newDraft() {
      editorChart = null;
      editorDraftId = null;
      openEditor();
    }

    function openEditor() {
      stopBGM(); stopChartAudio(); stopEditorPreview();
      if (!editorChart) {
        editorChart = { title: '', songId: Object.keys(SONGS)[0], chartType: 'piano', bpm: 120, offset: 0, noteSpeed: 0.6, notes: [] };
      }
      STATE = 'editor';
      gameMode = 'custom';
      edSong.value   = editorChart.songId;
      edType.value   = editorChart.chartType;
      edBpm.value    = editorChart.bpm;
      edOffset.value = editorChart.offset;
      if (editorNoteType === 'long' && editorChart.chartType === 'music') editorNoteType = 'normal';
      rebuildPalette();
      loadEditorSong();
      setScreen('editor');
      layoutEditorGrid();      // 表示後に実際の高さで再計算
      scrollEditorToStart();
      resetHistory();
    }

    // ----- プレビュー再生（叩かず流すだけ・グリッド同期スクロール）-----
    function toggleEditorPreview() {
      if (editorPlaying) { stopEditorPreview(); return; }
      cancelLongDrag();
      audioCtx.resume();
      const startT = Math.max(0, Math.min(songDuration(), tAtY(edScroll.scrollTop + edScroll.clientHeight * 0.5)));
      const song = SONGS[editorChart.songId];
