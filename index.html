      if (chartAudio.src.indexOf(song.file) === -1) { chartAudio.src = song.file; chartAudio.load(); }
      try { chartAudio.currentTime = startT; } catch (e) {}
      chartAudio.play().catch(console.error);
      songClockBaseAudio = startT;
      songClockBasePerf  = performance.now() / 1000;
      editorPlaying = true;
      edPlay.classList.add('playing');
      edPlay.textContent = '⏸';
      editorPreviewRAF = requestAnimationFrame(editorPreviewLoop);
    }
    function editorPreviewLoop() {
      if (!editorPlaying) return;
      const st = getSongTime();
      edNowline.style.top = yLine(st) + 'px';
      edScroll.scrollTop = yLine(st) - edScroll.clientHeight * 0.5;
      if (chartAudio.ended || st >= songDuration()) { stopEditorPreview(); return; }
      editorPreviewRAF = requestAnimationFrame(editorPreviewLoop);
    }
    function stopEditorPreview() {
      editorPlaying = false;
      chartAudio.pause();
      if (editorPreviewRAF) { cancelAnimationFrame(editorPreviewRAF); editorPreviewRAF = null; }
      edPlay.classList.remove('playing');
      edPlay.textContent = '▶';
    }

    // ----- 編集中の譜面を再生用オブジェクトに変換 -----
    function buildEditorChart() {
      syncEditorMeta();
      return {
        title:     editorChart.title || '無題',
        author:    nickname || 'no name',
        songId:    editorChart.songId,
        chartType: editorChart.chartType,
        bpm:       editorChart.bpm,
        offset:    editorChart.offset,
        noteSpeed: editorChart.noteSpeed || 0.6,
        notes:     editorChart.notes.map(n => ({ lane: n.lane, t: n.t, type: n.type, dur: n.dur || 0, w: n.w || 1 })),
      };
    }

    // ----- タップでBPM計測 -----
    let edTapTimes = [];
    document.getElementById('ed-tap').addEventListener('click', () => {
      const now = performance.now();
      edTapTimes = edTapTimes.filter(t => now - t < 3000);
      edTapTimes.push(now);
      if (edTapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < edTapTimes.length; i++) intervals.push(edTapTimes[i] - edTapTimes[i - 1]);
        const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const bpm = Math.max(30, Math.min(400, Math.round(60000 / avg)));
        editorChart.bpm = bpm; edBpm.value = bpm; layoutEditorGrid();
      }
    });

    // ----- コントロールのイベント -----
    edSong.addEventListener('change', () => { syncEditorMeta(); loadEditorSong(); });
    edType.addEventListener('change', () => {
      syncEditorMeta();
      // 型に合わないnoteを除去
      const allowed = editorChart.chartType === 'music' ? ['normal','heal','damage'] : ['normal','long'];
      editorChart.notes = editorChart.notes.filter(n => allowed.includes(n.type));
      editorNoteType = 'normal'; editorLongStart = null;
      rebuildPalette(); renderEditorNotes();
    });
    edBpm.addEventListener('change',    () => { syncEditorMeta(); layoutEditorGrid(); });
    edOffset.addEventListener('change', () => { syncEditorMeta(); layoutEditorGrid(); });
    document.querySelectorAll('.ed-subdiv').forEach(b => {
      b.addEventListener('click', () => {
        editorSubdiv = parseInt(b.dataset.subdiv, 10);
        document.querySelectorAll('.ed-subdiv').forEach(x => x.classList.toggle('active', x === b));
        layoutEditorGrid();
      });
    });
    document.querySelectorAll('.ed-width').forEach(b => {
      b.addEventListener('click', () => {
        editorWidth = parseInt(b.dataset.width, 10);
        document.querySelectorAll('.ed-width').forEach(x => x.classList.toggle('active', x === b));
      });
    });
    edUndoBtn.addEventListener('click', edUndo);
    edRedoBtn.addEventListener('click', edRedo);
    edPlay.addEventListener('click', toggleEditorPreview);
    document.getElementById('ed-test').addEventListener('click', () => {
      stopEditorPreview();
      cancelLongDrag();
      chartFromEditor = true;
      startChartGame(buildEditorChart(), 0);
    });
    document.getElementById('ed-test-here').addEventListener('click', () => {
      stopEditorPreview();
      cancelLongDrag();
      chartFromEditor = true;
      // いま見えている一番下(=最も早い時刻)から少し前を起点にする
      const fromT = Math.max(0, tAtY(edScroll.scrollTop + edScroll.clientHeight) - 1.0);
      startChartGame(buildEditorChart(), fromT);
    });
    document.getElementById('ed-save').addEventListener('click', async () => {
      stopEditorPreview();
      cancelLongDrag();
      syncEditorMeta();
      if (editorChart.notes.length === 0) { alert('ノーツを置いてから保存してね'); return; }
      const title = (prompt('譜面の名前を入力してください', editorChart.title || '') || '').trim();
      if (!title) return;
      editorChart.title = title;
      const btn = document.getElementById('ed-save');
      btn.disabled = true; btn.textContent = '保存中';
      try {
        await saveChart(buildEditorChart());
        alert('保存しました！「みんなの譜面」から遊べます');
      } catch (e) {
        console.error('save chart error:', e);
        alert('保存に失敗しました');
      }
      btn.disabled = false; btn.textContent = '保存';
    });
    document.getElementById('ed-new').addEventListener('click', () => {
      stopEditorPreview();
      cancelLongDrag();
      autoSaveDraft();   // 今の作りかけを下書きに保存してから新規
      newDraft();
    });
    document.getElementById('ed-back').addEventListener('click', () => {
      stopEditorPreview();
      cancelLongDrag();
      autoSaveDraft();   // 戻るときに自動で下書き保存
      openDrafts();
    });

    // ===== みんなの譜面（一覧→再生）=====
    async function openBrowse() {
      stopBGM(); stopChartAudio();
      STATE = 'browse';
      setScreen('browse');
      const list = document.getElementById('browse-list');
      list.innerHTML = '<div class="browse-empty">読み込み中...</div>';
      try {
        const charts = await loadCharts();
        if (charts.length === 0) { list.innerHTML = '<div class="browse-empty">まだ譜面がありません</div>'; return; }
        list.innerHTML = '';
        charts.forEach(c => {
          const song = SONGS[c.songId];
          const row = document.createElement('div');
          row.className = 'browse-item';

          const plays  = c.plays  || 0;
          const clears = c.clears || 0;
          const rate   = plays > 0 ? Math.round(clears / plays * 100) : 0;

          const play = document.createElement('button');
          play.className = 'bi-play';
          play.innerHTML =
            `<span class="bi-title">${escapeHtml(c.title)}</span>` +
            `<span class="bi-sub">${c.chartType === 'music' ? 'ミュージック' : 'ピアノ'} / ${escapeHtml(song ? song.title : c.songId)} / ${escapeHtml(c.author || '')}</span>` +
            `<span class="bi-stat">プレイ ${plays} ・ クリア ${clears} ・ クリア率 ${rate}%</span>`;
          play.addEventListener('click', () => playCommunityChart(c));
          row.appendChild(play);

          // 削除は作者本人(ニックネーム一致)のみ
          if (c.author && nickname && c.author === nickname) {
            const del = document.createElement('button');
            del.className = 'bi-del';
            del.textContent = '🗑';
            del.addEventListener('click', async () => {
              if (!confirm(`「${c.title}」を削除しますか？`)) return;
              del.disabled = true;
              try { await deleteChart(c.id); row.remove(); }
              catch (e) { console.error('delete chart error:', e); alert('削除に失敗しました'); del.disabled = false; }
            });
            row.appendChild(del);
          }
          list.appendChild(row);
        });
      } catch (e) {
        console.error('load charts error:', e);
        list.innerHTML = '<div class="browse-empty">読み込みに失敗しました</div>';
      }
    }
    function playCommunityChart(c) {
      chartFromEditor = false;   // リザルトからはスタート画面へ
      bumpChartStat(c.id, 'plays');
      startChartGame(c, 0);
    }
    document.getElementById('btn-mode-community').addEventListener('click', () => {
      nickname = document.getElementById('nickname-input').value.trim();
      openBrowse();
    });
    document.getElementById('browse-reload').addEventListener('click', openBrowse);
    document.getElementById('browse-back').addEventListener('click', () => {
      STATE = 'start';
      setScreen('start');
    });
