<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雷駿先輩</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes flashRed {
      0%, 100% { opacity: 0; }
      50%       { opacity: 1; }
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      touch-action: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ===== スタート画面 ===== */
    #screen-start {
      background: #000;
      color: #fff;
      gap: 24px;
    }

    #screen-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("kireishun.JPG");
      background-size: cover;
      background-position: center;
      opacity: 0.4;
      z-index: 0;
    }

    #screen-start > * {
      position: relative;
      z-index: 1;
    }

    #screen-start h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #mode-buttons {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .btn-mode {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }

    .btn-mode:hover, .btn-mode.active {
      background: #fff;
      color: #111;
    }

    /* ===== ゲーム画面 ===== */
    #screen-game {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      z-index: 10;
      pointer-events: none;
    }

    #hud-score {
      font-size: 120px;
      font-weight: 700;
      color: #ff69b4;
      line-height: 1;
    }

    #hud-timer {
      font-size: 60px;
      font-weight: 700;
      color: orange;
      line-height: 1;
    }

    #hud-timer.warning { color: #f44; }

    #hud-mode {
      font-size: 24px;
      font-weight: 700;
      color: #aaf;
      letter-spacing: 2px;
    }

    #hit-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 15%;
      border-top: 4px solid #ff69b4;
      background: rgba(255, 105, 180, 0.08);
      z-index: 5;
      pointer-events: none;
      display: none;
    }

    #lane-container {
      position: absolute;
      inset: 0;
      display: flex;
      background: #fff;
      overflow: hidden;
    }

    .lane {
      flex: 1;
      position: relative;
      border-right: 2px solid #ccc;
    }

    .lane:last-child { border-right: none; }

    .note {
      position: absolute;
      left: 4px;
      right: 4px;
      border-radius: 6px;
      background-image: url("IMG_E2720[1].JPG");
      background-size: cover;
      background-position: center;
    }

    /* ===== ゲームオーバー画面 ===== */
    #screen-gameover {
      background-color: #111;
      color: #fff;
      gap: 20px;
    }

    #screen-gameover h2 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f44;
    }

    #final-score {
      font-size: 32px;
      font-weight: 700;
    }

    #final-score span {
      font-size: 48px;
      color: #ff0;
    }

    #final-rank {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    #final-rank span {
      font-size: 40px;
      color: #ff69b4;
    }

    #nickname-input {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      text-align: center;
      width: 240px;
      outline: none;
    }

    #nickname-input::placeholder { color: #aaa; }

    #ranking-wrap {
      width: 280px;
      max-height: 180px;
      overflow-y: auto;
    }

    #ranking-title {
      font-size: 18px;
      font-weight: 700;
      color: #aaa;
      margin-bottom: 6px;
      text-align: center;
    }

    #ranking-list {
      list-style: none;
      width: 100%;
    }

    #ranking-list li {
      font-size: 15px;
      padding: 4px 0;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }

    #ranking-list li.me { color: #ff69b4; }

    #btn-retry {
      margin-top: 8px;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div id="screen-start" class="screen">
    <h1>雷駿先輩</h1>
    <input id="nickname-input" type="text" placeholder="ニックネームを入力" maxlength="12">
    <div id="mode-buttons">
      <button class="btn-mode active" id="btn-mode-score">スコアアタック</button>
      <button class="btn-mode" id="btn-mode-music">ミュージック</button>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div id="hud">
      <div id="hud-score">0</div>
      <div id="hud-timer">60</div>
      <div id="hud-mode"></div>
    </div>
    <div id="lane-container">
      <div class="lane" id="lane-0"></div>
      <div class="lane" id="lane-1"></div>
      <div class="lane" id="lane-2"></div>
      <div class="lane" id="lane-3"></div>
      <div id="hit-zone"></div>
    </div>
  </div>

  <div id="screen-gameover" class="screen">
    <h2>GAME OVER</h2>
    <div id="final-score">SCORE: <span id="final-score-value">0</span></div>
    <div id="final-rank">あなたは<span id="final-rank-value"></span>です</div>
    <div id="ranking-wrap">
      <div id="ranking-title">ランキング</div>
      <ol id="ranking-list"></ol>
    </div>
    <button id="btn-retry">RETRY</button>
  </div>

  <script type="module">
    // ===== Firebase =====
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, orderBy, query, limit, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBYH3HbOtNWO9luF68n6jLou9SZwwlBQCE",
      authDomain: "raishn-c40e8.firebaseapp.com",
      projectId: "raishn-c40e8",
      storageBucket: "raishn-c40e8.firebasestorage.app",
      messagingSenderId: "575446359290",
      appId: "1:575446359290:web:e3cde3f05cbe5d5854fd43"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    async function saveScore(nickname, score) {
      const ref = doc(db, 'scores', nickname);
      const existing = await getDoc(ref);
      if (!existing.exists() || existing.data().score < score) {
        await setDoc(ref, { nickname, score, timestamp: serverTimestamp() });
      }
    }

    async function loadRanking() {
      const q = query(collection(db, 'scores'), orderBy('score', 'desc'), limit(10));
      const snap = await getDocs(q);
      return snap.docs.map(d => d.data());
    }

    let nickname = '';

    // ===== 音声 (Web Audio API でラグゼロ) =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let tapBuffer = null;

    fetch('Voishun.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .then(decoded => { tapBuffer = decoded; });

    let gahoBuffer = null;
    fetch('gaho2.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .then(decoded => { gahoBuffer = decoded; });

    let bgmBuffer = null;
    fetch('Kurenaishin.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .then(decoded => { bgmBuffer = decoded; });

    function playGaho() {
      if (!gahoBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = gahoBuffer;
      src.connect(audioCtx.destination);
      src.start(0);
    }

    function playTapSound() {
      if (!tapBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = tapBuffer;
      src.connect(audioCtx.destination);
      src.start(0);
    }

    // ===== 定数 =====
    const TIME_LIMIT = 20;
    const ROWS = 3;

    // ===== 譜面 (ここを編集してください) =====
    // time : 曲開始から何秒後にそのnoteがヒットゾーンに届くか
    // lane : 0=左端  1=左中  2=右中  3=右端
    const MUSIC_CHART = [
      { time:  1.0, lane: 1 },
      { time:  1.5, lane: 3 },
      { time:  2.0, lane: 0 },
      { time:  2.5, lane: 2 },
      { time:  3.0, lane: 1 },
      { time:  3.5, lane: 0 },
      { time:  4.0, lane: 3 },
      { time:  4.5, lane: 2 },
      { time:  5.0, lane: 0 },
      { time:  5.5, lane: 1 },
      { time:  6.0, lane: 3 },
      { time:  6.5, lane: 2 },
      { time:  7.0, lane: 0 },
      { time:  7.5, lane: 3 },
      { time:  8.0, lane: 1 },
      { time:  8.5, lane: 0 },
      { time:  9.0, lane: 2 },
      { time:  9.5, lane: 3 },
      { time: 10.0, lane: 1 },
      { time: 10.5, lane: 0 },
    ];

    // ===== DOM =====
    const screens = {
      start:    document.getElementById('screen-start'),
      game:     document.getElementById('screen-game'),
      gameover: document.getElementById('screen-gameover'),
    };
    const hudScore      = document.getElementById('hud-score');
    const hudTimer      = document.getElementById('hud-timer');
    const finalScoreVal = document.getElementById('final-score-value');
    const laneContainer = document.getElementById('lane-container');
    const laneEls       = [0, 1, 2, 3].map(i => document.getElementById('lane-' + i));

    // ===== ゲーム状態 =====
    let STATE         = 'start';
    let gameMode      = 'score'; // 'score' | 'music'
    let score         = 0;
    let timeLeft      = TIME_LIMIT;
    let elapsedTotal  = 0;
    let lastTimestamp = null;
    let animFrameId   = null;
    let timerStarted  = false;
    // grid[0]=一番上の行, grid[3]=一番下の行, 各要素 {lane, el}
    let grid = [];

    // ===== ミュージックモード状態 =====
    const FALL_DURATION  = 2.0;    // noteが画面を縦断する秒数
    const HIT_ZONE_RATIO = 0.15;   // 画面下から何割をヒットゾーンとするか
    const NOTE_H_RATIO   = 0.325;  // noteの高さ割合
    let fallingNotes   = [];       // {lane, el, startTime}
    let chartIdx       = 0;        // 次にスポーンする譜面インデックス
    let bgmStartTime   = 0;        // BGM開始時のaudioCtx.currentTime
    let bgmSource      = null;

    // ===== 画面切り替え =====
    function setScreen(name) {
      Object.entries(screens).forEach(([key, el]) => {
        el.style.display = key === name ? 'flex' : 'none';
      });
    }

    // ===== グリッド寸法 =====
    function getRowHeight() {
      return laneContainer.offsetHeight / ROWS;
    }

    function getLaneWidth() {
      return laneContainer.offsetWidth / 4;
    }

    // ===== note要素を生成して指定行に配置 =====
    function createNoteEl(lane, row) {
      const rh = getRowHeight();
      const el = document.createElement('div');
      el.className = 'note';
      el.style.height = (rh - 8) + 'px';
      el.style.top    = (row * rh + 4) + 'px';
      laneEls[lane].appendChild(el);
      return el;
    }

    // ===== ゲーム開始時にグリッドを初期化 =====
    function initGrid() {
      // 4レーンをシャッフルして各行に割り当て（同じ行に複数出ない）
      const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
      grid = lanes.slice(0, ROWS).map((lane, row) => ({ lane, el: createNoteEl(lane, row) }));
    }

    // ===== タップ後にグリッドを1段進める =====
    // 呼び出し前に grid.pop() でタテ3(一番下)を削除済みであること
    function advanceGrid() {
      const rh = getRowHeight();

      // 残り3つ(タテ0〜2)をそれぞれ1段下へ移動
      grid.forEach((note, i) => {
        note.el.style.top = ((i + 1) * rh + 4) + 'px';
      });

      const newLane = Math.floor(Math.random() * 4);

      grid.unshift({ lane: newLane, el: createNoteEl(newLane, 0) });
    }

    // ===== ランク判定 =====
    function getRank(s) {
      if (s < 30)  return { name: '八島',      image: 'pig.JPG' };
      if (s < 60)  return { name: 'アンマー族', image: null };
      if (s < 100) return { name: '非発展',    image: 'homomaru.JPG' };
      if (s < 150) return { name: '発展',      image: 'hiro.JPG' };
      if (s < 160) return { name: '紫鳳',      image: 'sio.JPG' };
      return        { name: '野駿',       image: 'kareshun.PNG' };
    }

    // ===== ゲームオーバー =====
    async function triggerGameOver() {
      STATE = 'gameover';
      cancelAnimationFrame(animFrameId);
      // ミュージックモードのクリーンアップ
      chartIdx = 0;
      if (bgmSource) { try { bgmSource.stop(); } catch(e) {} bgmSource = null; }
      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      // スコアモードのクリーンアップ
      grid.forEach(note => note.el.remove());
      grid = [];
      // タイマーとヒットゾーンをリセット
      hudTimer.style.display = '';
      document.getElementById('hit-zone').style.display = 'none';
      document.getElementById('hud-mode').textContent = '';
      finalScoreVal.textContent = score;
      const rank = getRank(score);
      document.getElementById('final-rank-value').textContent = rank.name;
      const goScreen = document.getElementById('screen-gameover');
      if (rank.image) {
        goScreen.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("${rank.image}")`;
        goScreen.style.backgroundSize = 'cover';
        goScreen.style.backgroundPosition = 'center';
      } else {
        goScreen.style.backgroundImage = 'none';
      }
      setScreen('gameover');

      // スコア保存 & ランキング表示
      try {
        await saveScore(nickname, score);
        const rankings = await loadRanking();
        const list = document.getElementById('ranking-list');
        list.innerHTML = rankings.map((r, i) => {
          const isMe = r.nickname === nickname && r.score === score;
          return `<li class="${isMe ? 'me' : ''}"><span>${i + 1}. ${r.nickname}</span><span>${r.score}</span></li>`;
        }).join('');
      } catch (err) {
        console.error('ranking error:', err);
      }
    }

    // ===== ミス時: 赤点滅2回してからゲームオーバー =====
    function flashAndGameOver(tapLane, tapRow) {
      STATE = 'flashing';
      cancelAnimationFrame(animFrameId);
      playGaho();

      const rh = getRowHeight();
      const lw = getLaneWidth();
      const clampedLane = Math.max(0, Math.min(3, tapLane));
      const clampedRow  = Math.max(0, Math.min(ROWS - 1, tapRow));

      const flash = document.createElement('div');
      flash.style.cssText = [
        'position:absolute',
        `left:${clampedLane * lw + 4}px`,
        `top:${clampedRow * rh + 4}px`,
        `width:${lw - 8}px`,
        `height:${rh - 8}px`,
        'background:#f44',
        'border-radius:6px',
        'z-index:20',
        'animation:flashRed 0.25s ease 2',
        'pointer-events:none',
      ].join(';');
      laneContainer.appendChild(flash);

      flash.addEventListener('animationend', () => {
        flash.remove();
        triggerGameOver();
      });
    }

    // ===== タップ判定 =====
    function handleInput(e) {
      if (STATE !== 'playing') return;
      e.preventDefault();

      const rect = laneContainer.getBoundingClientRect();
      const lw   = getLaneWidth();

      const points = e.changedTouches
        ? Array.from(e.changedTouches).map(t => ({
            x: t.clientX - rect.left,
            y: t.clientY - rect.top,
          }))
        : [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];

      if (gameMode === 'music') {
        handleMusicTap(Math.floor(points[0].x / lw));
        return;
      }

      const rh = getRowHeight();
      let anyHit = false;
      for (const p of points) {
        const tapRow  = Math.floor(p.y / rh);
        const tapLane = Math.floor(p.x / lw);

        if (tapRow === ROWS - 1 && grid[ROWS - 1] && grid[ROWS - 1].lane === tapLane) {
          grid[ROWS - 1].el.remove();
          grid.pop();
          score++;
          hudScore.textContent = score;
          playTapSound();
          if (!timerStarted) { timerStarted = true; lastTimestamp = null; }
          advanceGrid();
          anyHit = true;
          break;
        }
      }

      if (!anyHit) {
        const p = points[0];
        flashAndGameOver(Math.floor(p.x / lw), Math.floor(p.y / rh));
      }
    }

    // ===== ゲームループ (タイマーのみ) =====
    function gameLoop(timestamp) {
      if (STATE !== 'playing') return;

      const rawDelta = lastTimestamp === null ? 0 : (timestamp - lastTimestamp) / 1000;
      const delta = Math.min(rawDelta, 0.1);
      lastTimestamp = timestamp;

      if (timerStarted) {
        elapsedTotal += delta;
        timeLeft -= delta;

        if (timeLeft <= 0) {
          timeLeft = 0;
          triggerGameOver();
          return;
        }
      }

      hudTimer.textContent = Math.ceil(timeLeft);
      hudTimer.classList.toggle('warning', timeLeft < 10);

      animFrameId = requestAnimationFrame(gameLoop);
    }

    // ===== スコアモード開始 =====
    function startGame() {
      audioCtx.resume();
      score         = 0;
      timeLeft      = TIME_LIMIT;
      elapsedTotal  = 0;
      lastTimestamp = null;
      timerStarted  = false;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(note => note.el.remove());
      grid = [];

      hudScore.textContent = '0';
      hudTimer.textContent = TIME_LIMIT;
      hudTimer.classList.remove('warning');
      hudTimer.style.display = '';
      document.getElementById('hit-zone').style.display = 'none';
      document.getElementById('hud-mode').textContent = '';

      setScreen('game');
      STATE = 'playing';
      initGrid();
      animFrameId = requestAnimationFrame(gameLoop);
    }

    // ===== ミュージックモード =====
    function stopBGM() {
      if (bgmSource) { try { bgmSource.stop(); } catch(e) {} bgmSource = null; }
    }

    function spawnChartNote(lane) {
      const screenH = laneContainer.offsetHeight;
      const noteH   = Math.floor(screenH * NOTE_H_RATIO);
      const el = document.createElement('div');
      el.className = 'note';
      el.style.height = noteH + 'px';
      el.style.top    = -noteH + 'px';
      laneEls[lane].appendChild(el);
      fallingNotes.push({ lane, el, startTime: audioCtx.currentTime });
    }

    function musicGameLoop() {
      if (STATE !== 'playing') return;
      const screenH    = laneContainer.offsetHeight;
      const fallSpeed  = screenH / FALL_DURATION;
      const noteH      = Math.floor(screenH * NOTE_H_RATIO);
      const hitZoneTop = screenH * (1 - HIT_ZONE_RATIO);
      const now        = audioCtx.currentTime;
      const songTime   = now - bgmStartTime;

      // 譜面に従ってnoteをスポーン
      while (chartIdx < MUSIC_CHART.length) {
        const entry = MUSIC_CHART[chartIdx];
        if (songTime >= entry.time - FALL_DURATION) {
          spawnChartNote(entry.lane);
          chartIdx++;
        } else {
          break;
        }
      }

      // noteの位置更新・ミス検出
      let missedLane = -1;
      for (let i = fallingNotes.length - 1; i >= 0; i--) {
        const note    = fallingNotes[i];
        const noteTop = (now - note.startTime) * fallSpeed - noteH;
        note.el.style.top = noteTop + 'px';
        if (noteTop > screenH) {
          note.el.remove();
          fallingNotes.splice(i, 1);
          missedLane = note.lane;
        }
      }

      if (missedLane >= 0) {
        stopBGM();
        flashAndGameOver(missedLane, ROWS - 1);
        return;
      }

      // 譜面終了 & 画面上のnoteが全部消えたらクリア
      if (chartIdx >= MUSIC_CHART.length && fallingNotes.length === 0) {
        stopBGM();
        triggerGameOver();
        return;
      }

      animFrameId = requestAnimationFrame(musicGameLoop);
    }

    function handleMusicTap(tapLane) {
      const screenH    = laneContainer.offsetHeight;
      const fallSpeed  = screenH / FALL_DURATION;
      const noteH      = Math.floor(screenH * NOTE_H_RATIO);
      const hitZoneTop = screenH * (1 - HIT_ZONE_RATIO);
      const now        = audioCtx.currentTime;

      for (let i = 0; i < fallingNotes.length; i++) {
        const note    = fallingNotes[i];
        const noteTop = (now - note.startTime) * fallSpeed - noteH;
        const noteBot = noteTop + noteH;
        if (note.lane === tapLane && noteBot > hitZoneTop && noteTop < screenH) {
          note.el.remove();
          fallingNotes.splice(i, 1);
          score++;
          hudScore.textContent = score;
          playTapSound();
          return;
        }
      }
      // ヒットゾーンにnoteがないのにタップ → ミス
      stopBGM();
      flashAndGameOver(tapLane, ROWS - 1);
    }

    function startMusicGame() {
      audioCtx.resume();
      score    = 0;
      chartIdx = 0;

      fallingNotes.forEach(n => n.el.remove());
      fallingNotes = [];
      grid.forEach(note => note.el.remove());
      grid = [];
      stopBGM();

      hudScore.textContent = '0';
      hudTimer.style.display = 'none';
      document.getElementById('hit-zone').style.display = 'block';
      document.getElementById('hud-mode').textContent = 'MUSIC';

      setScreen('game');
      STATE = 'playing';

      // BGM再生
      if (bgmBuffer) {
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = bgmBuffer;
        bgmSource.loop   = false;
        bgmSource.connect(audioCtx.destination);
        bgmSource.start(0);
        bgmStartTime = audioCtx.currentTime;
      }

      animFrameId = requestAnimationFrame(musicGameLoop);
    }

    function restartGame() {
      if (gameMode === 'music') startMusicGame();
      else startGame();
    }

    // ===== キーボード入力 (D=0, F=1, J=2, K=3) =====
    const KEY_LANE = { d: 0, f: 1, j: 2, k: 3 };

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (STATE === 'start') {
          const input = document.getElementById('nickname-input');
          nickname = input.value.trim();
          if (!nickname) { input.focus(); return; }
          restartGame();
        } else if (STATE === 'gameover') {
          restartGame();
        }
        return;
      }
      if (STATE !== 'playing') return;
      const lane = KEY_LANE[e.key.toLowerCase()];
      if (lane === undefined) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (gameMode === 'music') {
        handleMusicTap(lane);
        return;
      }

      const bottomNote = grid[ROWS - 1];
      if (bottomNote && bottomNote.lane === lane) {
        bottomNote.el.remove();
        grid.pop();
        score++;
        hudScore.textContent = score;
        playTapSound();
        if (!timerStarted) { timerStarted = true; lastTimestamp = null; }
        advanceGrid();
      } else {
        flashAndGameOver(lane, ROWS - 1);
      }
    });

    // ===== イベント登録 =====
    function checkNicknameAndStart() {
      const input = document.getElementById('nickname-input');
      nickname = input.value.trim();
      if (!nickname) { input.focus(); return; }
      restartGame();
    }

    document.getElementById('btn-mode-score').addEventListener('click', () => {
      gameMode = 'score';
      document.getElementById('btn-mode-score').classList.add('active');
      document.getElementById('btn-mode-music').classList.remove('active');
      checkNicknameAndStart();
    });

    document.getElementById('btn-mode-music').addEventListener('click', () => {
      gameMode = 'music';
      document.getElementById('btn-mode-music').classList.add('active');
      document.getElementById('btn-mode-score').classList.remove('active');
      checkNicknameAndStart();
    });

    document.getElementById('btn-retry').addEventListener('click', restartGame);

    laneContainer.addEventListener('touchstart', handleInput, { passive: false });
    laneContainer.addEventListener('mousedown', handleInput);

    // ===== 初期表示 =====
    setScreen('start');
  </script>
</body>
</html>
