<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>音ゲー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      touch-action: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ===== スタート画面 ===== */
    #screen-start {
      background: #111;
      color: #fff;
      gap: 24px;
    }

    #screen-start h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #screen-start p {
      font-size: 14px;
      color: #aaa;
      text-align: center;
      line-height: 1.8;
      padding: 0 32px;
    }

    #btn-start {
      margin-top: 16px;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
    }

    /* ===== ゲーム画面 ===== */
    #screen-game {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 60px;
      background: #111;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
      z-index: 10;
    }

    #hud-timer { transition: color 0.3s; }
    #hud-timer.warning { color: #f44; }

    #lane-container {
      flex: 1;
      display: flex;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    .lane {
      flex: 1;
      position: relative;
      border-right: 2px solid #ccc;
    }

    .lane:last-child { border-right: none; }

    .note {
      position: absolute;
      left: 4px;
      right: 4px;
      border-radius: 6px;
      background-image: url("IMG_E2720[1].JPG");
      background-size: cover;
      background-position: center;
    }

    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ccc;
      z-index: 1;
      pointer-events: none;
    }

    /* ===== ゲームオーバー画面 ===== */
    #screen-gameover {
      background: #111;
      color: #fff;
      gap: 20px;
    }

    #screen-gameover h2 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f44;
    }

    #final-score {
      font-size: 32px;
      font-weight: 700;
    }

    #final-score span {
      font-size: 48px;
      color: #ff0;
    }

    #btn-retry {
      margin-top: 16px;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div id="screen-start" class="screen">
    <h1>音ゲー</h1>
    <p>
      一番下のnoteをタップしよう<br>
      note以外をタップするとゲームオーバー<br>
      60秒間でどれだけスコアを稼げるか？
    </p>
    <button id="btn-start">START</button>
  </div>

  <div id="screen-game" class="screen">
    <div id="hud">
      <div id="hud-score">0</div>
      <div id="hud-timer">60</div>
    </div>
    <div id="lane-container">
      <div class="lane" id="lane-0"></div>
      <div class="lane" id="lane-1"></div>
      <div class="lane" id="lane-2"></div>
      <div class="lane" id="lane-3"></div>
    </div>
  </div>

  <div id="screen-gameover" class="screen">
    <h2>GAME OVER</h2>
    <div id="final-score">SCORE: <span id="final-score-value">0</span></div>
    <button id="btn-retry">RETRY</button>
  </div>

  <script>
    // ===== 音声 =====
    const tapSound = new Audio('Voishun.mp3');

    function playTapSound() {
      const s = tapSound.cloneNode();
      s.volume = 1.0;
      s.play();
    }

    // ===== 定数 =====
    const TIME_LIMIT = 60;
    const ROWS = 3;

    // ===== DOM =====
    const screens = {
      start:    document.getElementById('screen-start'),
      game:     document.getElementById('screen-game'),
      gameover: document.getElementById('screen-gameover'),
    };
    const hudScore      = document.getElementById('hud-score');
    const hudTimer      = document.getElementById('hud-timer');
    const finalScoreVal = document.getElementById('final-score-value');
    const laneContainer = document.getElementById('lane-container');
    const laneEls       = [0, 1, 2, 3].map(i => document.getElementById('lane-' + i));

    // ===== ゲーム状態 =====
    let STATE         = 'start';
    let score         = 0;
    let timeLeft      = TIME_LIMIT;
    let elapsedTotal  = 0;
    let lastTimestamp = null;
    let animFrameId   = null;
    // grid[0]=一番上の行, grid[3]=一番下の行, 各要素 {lane, el}
    let grid = [];

    // ===== 画面切り替え =====
    function setScreen(name) {
      Object.entries(screens).forEach(([key, el]) => {
        el.style.display = key === name ? 'flex' : 'none';
      });
    }

    // ===== グリッド寸法 =====
    function getRowHeight() {
      return laneContainer.offsetHeight / ROWS;
    }

    function getLaneWidth() {
      return laneContainer.offsetWidth / 4;
    }

    // ===== note要素を生成して指定行に配置 =====
    function createNoteEl(lane, row) {
      const rh = getRowHeight();
      const el = document.createElement('div');
      el.className = 'note';
      el.style.height = (rh - 8) + 'px';
      el.style.top    = (row * rh + 4) + 'px';
      laneEls[lane].appendChild(el);
      return el;
    }

    // ===== ゲーム開始時にグリッドを初期化 =====
    function initGrid() {
      // 4レーンをシャッフルして各行に割り当て（同じ行に複数出ない）
      const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
      grid = lanes.slice(0, ROWS).map((lane, row) => ({ lane, el: createNoteEl(lane, row) }));
    }

    // ===== タップ後にグリッドを1段進める =====
    // 呼び出し前に grid.pop() でタテ3(一番下)を削除済みであること
    function advanceGrid() {
      const rh = getRowHeight();

      // 残り3つ(タテ0〜2)をそれぞれ1段下へ移動
      grid.forEach((note, i) => {
        note.el.style.top = ((i + 1) * rh + 4) + 'px';
      });

      // 上段の新しいnoteのレーンを決定（既存と重ならないものを優先）
      const existingLanes = new Set(grid.map(n => n.lane));
      const freeLanes = [0, 1, 2, 3].filter(l => !existingLanes.has(l));
      const newLane = freeLanes.length > 0
        ? freeLanes[Math.floor(Math.random() * freeLanes.length)]
        : Math.floor(Math.random() * 4);

      grid.unshift({ lane: newLane, el: createNoteEl(newLane, 0) });
    }

    // ===== 横のグリッド線を描画 =====
    function addGridLines() {
      laneContainer.querySelectorAll('.grid-line').forEach(el => el.remove());
      const lh = laneContainer.offsetHeight;
      for (let i = 1; i < ROWS; i++) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.top = (lh / ROWS * i) + 'px';
        laneContainer.appendChild(line);
      }
    }

    // ===== ゲームオーバー =====
    function triggerGameOver() {
      STATE = 'gameover';
      cancelAnimationFrame(animFrameId);
      grid.forEach(note => note.el.remove());
      grid = [];
      finalScoreVal.textContent = score;
      setScreen('gameover');
    }

    // ===== タップ判定 =====
    function handleInput(e) {
      if (STATE !== 'playing') return;
      e.preventDefault();

      const rect = laneContainer.getBoundingClientRect();
      const rh   = getRowHeight();
      const lw   = getLaneWidth();

      const points = e.changedTouches
        ? Array.from(e.changedTouches).map(t => ({
            x: t.clientX - rect.left,
            y: t.clientY - rect.top,
          }))
        : [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];

      let anyHit = false;
      for (const p of points) {
        const tapRow  = Math.floor(p.y / rh);
        const tapLane = Math.floor(p.x / lw);

        // 有効: 一番下の行(タテ1 = ROWS-1)の正しいレーンをタップ
        if (tapRow === ROWS - 1 && grid[ROWS - 1] && grid[ROWS - 1].lane === tapLane) {
          grid[ROWS - 1].el.remove();
          grid.pop();
          score++;
          hudScore.textContent = score;
          playTapSound();
          advanceGrid();
          anyHit = true;
          break;
        }
      }

      if (!anyHit) {
        triggerGameOver();
      }
    }

    // ===== ゲームループ (タイマーのみ) =====
    function gameLoop(timestamp) {
      if (STATE !== 'playing') return;

      const rawDelta = lastTimestamp === null ? 0 : (timestamp - lastTimestamp) / 1000;
      const delta = Math.min(rawDelta, 0.1);
      lastTimestamp = timestamp;

      elapsedTotal += delta;
      timeLeft -= delta;

      if (timeLeft <= 0) {
        timeLeft = 0;
        triggerGameOver();
        return;
      }

      hudTimer.textContent = Math.ceil(timeLeft);
      hudTimer.classList.toggle('warning', timeLeft < 10);

      animFrameId = requestAnimationFrame(gameLoop);
    }

    // ===== ゲーム開始 =====
    function startGame() {
      score         = 0;
      timeLeft      = TIME_LIMIT;
      elapsedTotal  = 0;
      lastTimestamp = null;

      grid.forEach(note => note.el.remove());
      grid = [];

      hudScore.textContent = '0';
      hudTimer.textContent = TIME_LIMIT;
      hudTimer.classList.remove('warning');

      setScreen('game');
      addGridLines();
      STATE = 'playing';
      initGrid();
      animFrameId = requestAnimationFrame(gameLoop);
    }

    // ===== イベント登録 =====
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-retry').addEventListener('click', startGame);

    laneContainer.addEventListener('touchstart', handleInput, { passive: false });
    laneContainer.addEventListener('mousedown', handleInput);

    // ===== 初期表示 =====
    setScreen('start');
  </script>
</body>
</html>
